   canvas backing store is RS times the logical size and the context
   is scaled by RS, so the art is rasterised at full device
   resolution — crisp edges, readable 7px labels, no upscaling.
   (It used to be drawn on a low-resolution bitmap and upscaled with
   image-rendering:pixelated; on a devicePixelRatio 2-3 screen that
   read as downscaled no matter the zoom, which is why RS exists.)
   iso(gx,gy,z): screenX = OX + (gx-gy)*16, screenY = OY + (gx+gy)*8 - z.
   +1 gx moves (+16,+8); +1 gy moves (-16,+8); +1 in both moves (0,+16)

/* ---------- Room occupants: the walker IS the occupant ----------
   Where a guest stands inside their room (tile coords). The walker's
   final waypoint is this same point, so the handoff is seamless:
   the walker walks here, stops, and the identical sprite is left
   standing here. */
function roomStandPt(r){return [r.gx+roomW(r)-1.45,r.gy+roomH(r)-1.65];}
function clearOccupants(){
  occupants.forEach(function(oc){if(oc.el&&oc.el.parentNode)oc.el.parentNode.removeChild(oc.el);});
  occupants=[];
}
/* One occupant sprite per occupied room on the floor being viewed,
   built with the EXACT sprite spawnPerson uses for the walker —
   the same character's painted standing panel, or (for archetypes
   with no sheet) personSVG(hex(arch.color), {suitcase:true,
   archKey, seed: guestSeed(guest)}) — so the occupant is literally
   the same drawing as the person who walked in.
   While that guest's walker is still on screen (walking to the
   desk, deciding, or heading down the hallway to the room) NO
   occupant is drawn for their room: the walker is the only copy
   of that person. The moment the walker arrives and is removed,
   finishWalker rebuilds the scene and the occupant appears at the
   spot the walker stopped. */
function buildOccupants(){
  clearOccupants();
  if(!peopleLayer||G.view!=="floor")return;
  G.rooms.forEach(function(r){
    if(r.floor!==G.curFloor||r.state!=="occupied"||!r.guest)return;
    var stillWalking=false;
    for(var i=0;i<walkers.length;i++){
      if(walkers[i].guest&&walkers[i].guest.id===r.guest.id){stillWalking=true;break;}
    }
    if(stillWalking)return;
    var el=document.createElement("div");
    el.className="walker occupant";
    var ckOcc=CHAR_GUEST[r.guest.arch.key]||null;
    el.innerHTML=charFigHTML(ckOcc,DIR_SE,0,false)||('<span class="fig">'+personSVG(hex(r.guest.arch.color),{suitcase:true,archKey:r.guest.arch.key,seed:guestSeed(r.guest)})+'</span>');
    peopleLayer.appendChild(el);
    var pt=roomStandPt(r),pp=projPct(pt[0],pt[1]);
    el.style.left=pp[0]+"%";el.style.top=pp[1]+"%";
    el.style.zIndex=personZ(pp[1]);
    occupants.push({el:el,roomId:r.id,guestId:r.guest.id});
  });
}
/* ---------- Guest pathing on the ground grid ----------
   Guests follow the grid: street entrance -> across the lawn to the
   lobby -> decide at the desk -> then the ACTUAL hallway path (BFS
   over hallway + lobby tiles) to the tile in front of their room's
   door -> in through the door. With no lobby they walk across the
   grass straight to the first room's door. If their room has no
   hallway path, the door decision already turned them away — they
   never set off. Upstairs rooms: hallway path to the ground-floor
   stair foot is beyond this view, so they walk the lobby's path out
   and vanish at the stairs marker (east edge). */
function pathPts(list){return list.map(function(p){return projPct(p[0],p[1]);});}
function lobbyCenter(){return [G.lobbyGx+lobbyW()/2,G.lobbyGy+lobbyH()/2];}
function lobbyDoorFront(){
  if(G.lobbyGx==null)return [GRID_W/2,GRID_H-0.4];
  var c=lobbyCenter(),rot=G.lobbyRot||2;
  if(rot===0)return [c[0],G.lobbyGy-0.4];
  if(rot===1)return [G.lobbyGx+lobbyW()+0.4,c[1]];
  if(rot===2)return [c[0],G.lobbyGy+lobbyH()+0.4];
  return [G.lobbyGx-0.4,c[1]];
}
function streetPt(){return [GRID_W/2,GRID_H+0.6];}
/* guest walker: entrance -> lobby (or door) -> decision -> hallway path -> room */
function spawnPerson(g){
  var inTheatre=(G.view==="floor"&&G.curFloor===1);
  if(!sceneReady||!inTheatre||walkers.length>=6){
    resolveGuest(g);rebuildScene();updateHUD();return;
  }
  var el=document.createElement("div");el.className="walker";
  var ckGuest=CHAR_GUEST[g.arch.key]||null;
  el.innerHTML=charFigHTML(ckGuest,DIR_SE,0,false)||('<span class="fig">'+personSVG(hex(g.arch.color),{suitcase:true,archKey:g.arch.key,seed:guestSeed(g)})+'</span>');
  peopleLayer.appendChild(el);
  var w={el:el,guest:g,state:"walk",wait:0,decided:false,ok:false,room:null,bubble:null,ph:Math.random()*6,charKey:ckGuest,dir:DIR_SE};
  var st2=projPct(streetPt()[0],streetPt()[1]);w.x=st2[0];w.y=st2[1];
  if(G.lobby>0&&G.lobbyGx!=null){
    var df=lobbyDoorFront(),lc=lobbyCenter();
    w.wp=pathPts([[streetPt()[0],df[1]],df,lc]); /* street -> lobby door -> desk */
    w.atPt=lc;
  }else{
    var r0=G.rooms.filter(function(r){return r.floor===1;})[0];
    if(r0){var dfr=doorFront(r0);w.wp=pathPts([[dfr[0]+0.5,GRID_H-0.4],[dfr[0]+0.5,dfr[1]+0.5]]);w.atPt=[dfr[0]+0.5,dfr[1]+0.5];}
    else{w.wp=pathPts([streetPt()]);w.atPt=streetPt();}
  }
  w.wi=0;placeWalker(w);
  walkers.push(w);
}
function placeWalker(w){w.el.style.left=w.x+"%";w.el.style.top=w.y+"%";w.el.style.zIndex=personZ(w.y);}
function setBubble(w,text,bad){
  clearBubble(w);
  var b=document.createElement("span");b.className="bubble"+(bad?" bad":"");
  b.textContent=text;w.el.appendChild(b);w.bubble=b;
}
function clearBubble(w){if(w.bubble&&w.bubble.parentNode)w.bubble.parentNode.removeChild(w.bubble);w.bubble=null;}
function finishWalker(idx,w){
  if(w.el&&w.el.parentNode)w.el.parentNode.removeChild(w.el);
  walkers.splice(idx,1);
  if(w.state==="toStairs"){rebuildScene();updateHUD();}
}
function tickPeople(dt){
  for(var i=walkers.length-1;i>=0;i--){
    var w=walkers[i];
    w.ph+=dt*4.5; /* walk-cycle cadence halved with travel speed, so the bob/frames stay in step with the feet */
    w.el.style.marginTop=(-PW*1.34+Math.abs(Math.sin(w.ph))*-PW*0.05)+"px";
    if(w.state==="wait"){
      if(w.charKey)setCharFig(w.el,w.charKey,w.dir,0,false); /* standing panel while deciding */
      w.wait-=dt;
      if(w.wait<=0){
        clearBubble(w);
        if(w.decided&&w.ok){
          if(w.room&&w.room.floor===1&&G.lobby>0){
            var path=gridPathToRoom(w.room); /* the real hallway route, tile by tile */
            if(path){
              var full=path.concat([roomStandPt(w.room)]); /* door front -> the exact spot the occupant sprite will stand */
              w.wp=pathPts(full);
            }else{w.wp=pathPts([lobbyDoorFront(),streetPt()]);}
          }
          else if(w.room&&w.room.floor===1){
            var dfr3=doorFront(w.room);
            w.wp=pathPts([[dfr3[0]+0.5,dfr3[1]+0.5],roomStandPt(w.room)]); /* across the grass to their door, then in to the occupant's standing spot */
          }
          else{
            /* upstairs room: walk the REAL hallway path from the lobby
               to the stair/elevator shaft, then ride it up */
            var vPath=(G.lobby>0)?gridPathToVertical():null;
            if(vPath){w.wp=pathPts(vPath);}
            else if((G.verticals||[]).length){var v0=G.verticals[0];w.wp=pathPts([[v0.gx+1,GRID_H-0.4],[v0.gx+1,v0.gy+1]]);} /* no lobby: across the grass to the shaft foot */
            else{w.wp=pathPts([lobbyDoorFront(),streetPt()]);}
          }
          w.wi=0;w.state="toStairs";
        }
        else if(w.decided){
          if(G.lobby>0&&G.lobbyGx!=null){var dfL=lobbyDoorFront();w.wp=pathPts([dfL,[streetPt()[0],dfL[1]],streetPt()]);}
          else if(w.atPt){w.wp=pathPts([[w.atPt[0],GRID_H-0.4],streetPt()]);}
          else{w.wp=pathPts([streetPt()]);}
          w.wi=0;w.state="leave";
        }
        else{
          var d=resolveGuest(w.guest);w.ok=d.ok;w.decided=true;w.wait=1.5;
          if(d.ok)w.room=d.room;
          var txt=d.ok?("✓ $"+priceFor(d.room)):(d.reason==="price"?"✕ too much":d.reason==="standard"?"✕ standard":d.reason==="party"?"✕ party size":d.reason==="noPath"?"✕ no path to a room":"✕ no room");
          setBubble(w,txt,!d.ok);
          updateHUD();
        }
      }
      continue;
    }
    var tgt=w.wp[w.wi];
    if(!tgt){finishWalker(i,w);continue;}
    var dx=tgt[0]-w.x,dy=tgt[1]-w.y,dist=Math.hypot(dx,dy);
    if(w.charKey){
      /* painted sprite: face the travel direction, alternate the
         two walk frames; the panels replace the old mirror-flip */
      if(dist>=1.4){w.dir=dirFromScreenVec(dx,dy);setCharFig(w.el,w.charKey,w.dir,(Math.sin(w.ph)>=0?0:1),true);}
    }else{
      w.el.classList.toggle("flip",dx<-0.2);
    }
    if(dist<1.4){
      w.wi++;
      if(w.state==="walk"&&w.wi>=w.wp.length){w.state="wait";w.wait=0.7;}
      else if(w.wi>=w.wp.length)finishWalker(i,w);
      continue;
    }
    var step=Math.min(dist,10*dt); /* guest walk speed, % of scene per second — halved (was 20) so people amble while the faster clock turns */
    w.x+=dx/dist*step;w.y+=dy/dist*step;
    placeWalker(w);
  }
  staffFigs.forEach(function(st){
    if(st.mode!=="patrol")return;
    st.ph+=dt*3.5; /* walk-cycle cadence halved with patrol speed */
    st.gx+=st.dir*st.sp*dt;
    if(st.gx>st.b)st.dir=-1; if(st.gx<st.a)st.dir=1;
    var pp=projPct(st.gx,st.gy);
    st.el.style.left=pp[0]+"%";st.el.style.top=pp[1]+"%";
    st.el.style.zIndex=personZ(pp[1]); /* a patrol crosses depths as it walks, so its stacking follows */
    st.el.style.marginTop=(-PW*1.30+Math.abs(Math.sin(st.ph))*-PW*0.04)+"px";
    if(st.charKey){setCharFig(st.el,st.charKey,st.dir>0?DIR_SE:DIR_NW,(Math.sin(st.ph)>=0?0:1),true);st.el.style.transform="";}
    else st.el.style.transform=st.dir<0?"scaleX(-1)":"";
  });
}
/* ================= MODIFY menu: tap something already placed =================
   Tapping a room, the lobby, a shaft, an amenity or a hallway tile
   opens THIS menu — never the Build drawer. From here you upgrade
   that one thing, MOVE it (tap a new spot, hold 1s), ROTATE it in
   place, or remove it. Building new things is the Build tab's job. */
var modifyArm={key:null,at:0};
function armCheck(keyStr){
  if(modifyArm.key===keyStr&&Date.now()-modifyArm.at<=8000){modifyArm.key=null;return true;}
  modifyArm.key=keyStr;modifyArm.at=Date.now();return false;
}
/* ---------- Centre the tapped thing between the menus ----------
   When a placed thing is tapped its MODIFY (upgrade) menu appears
   at the bottom of the screen. The camera then pans so the thing
   sits at the centre of the free area BETWEEN the top HUD menu and
   the top edge of that upgrade menu — horizontally centred on the
   screen, vertically centred in that band. The pan is computed
   from the canvas's actual on-screen rect, so it is exact at any
   zoom: moving camX/camY by the screen-space delta moves the world
   point by exactly that delta. */
function centerWorldPoint(wx,wy){
  if(!cv)return;
  var wrapEl=document.getElementById("sceneWrap"); if(!wrapEl)return;
  var wr=wrapEl.getBoundingClientRect(); if(!wr.width||!wr.height)return;
  var hudEl=document.getElementById("hud");
  var hudBottom=hudEl?(hudEl.getBoundingClientRect().bottom-wr.top):0;
  if(hudBottom<0)hudBottom=0; if(hudBottom>=wr.height)hudBottom=0;
  var bandBottom=wr.height;
  var selEl=document.getElementById("selInfo");
  if(selEl&&selEl.style.display!=="none"){
    var sr=selEl.getBoundingClientRect();
    if(sr.height>0&&sr.top>wr.top+hudBottom)bandBottom=sr.top-wr.top;
  }
  if(bandBottom<=hudBottom)bandBottom=wr.height;
  var tx=wr.left+wr.width/2;
  var ty=wr.top+(hudBottom+bandBottom)/2;
  var rect=cv.getBoundingClientRect(); if(!rect.width)return;
  var curX=rect.left+(wx/CVW)*rect.width;
  var curY=rect.top+(wy/CVH)*rect.height;
  camX+=Math.round(tx-curX);
  camY+=Math.round(ty-curY);
  applyCam();
}
function scheduleCenterOn(gx,gy){
  var pt; try{pt=iso(gx,gy);}catch(e){return;}
  /* double rAF: the upgrade menu must be laid out (its top edge
     defines the band) and the scene redrawn before measuring */
  requestAnimationFrame(function(){requestAnimationFrame(function(){centerWorldPoint(pt[0],pt[1]);});});
}
function selectRoom(id){G.selectedRoomId=id;G.selected={kind:"room",id:id};closeDrawer();refreshSelInfo();renderStage();var r=byId(id);if(r)scheduleCenterOn(r.gx+roomW(r)/2,r.gy+roomH(r)/2);}
function selectLobby(){G.selectedRoomId=null;G.selected={kind:"lobby"};closeDrawer();refreshSelInfo();renderStage();if(G.lobbyGx!=null)scheduleCenterOn(G.lobbyGx+lobbyW()/2,G.lobbyGy+lobbyH()/2);}
function selectDining(){G.selectedRoomId=null;G.selected={kind:"dining"};closeDrawer();refreshSelInfo();renderStage();if(G.diningGx!=null)scheduleCenterOn(G.diningGx+diningW()/2,G.diningGy+diningH()/2);}
function selectAmenity(key){G.selectedRoomId=null;G.selected={kind:"amenity",key:key};closeDrawer();refreshSelInfo();renderStage();var sp=(G.amenitySpots||{})[key];if(sp)scheduleCenterOn(sp.gx+sp.w/2,sp.gy+sp.h/2);}
function selectVertical(gx,gy){G.selectedRoomId=null;G.selected={kind:"vertical",gx:gx,gy:gy};closeDrawer();refreshSelInfo();renderStage();scheduleCenterOn(gx+1,gy+1);}
function selectHall(gx,gy,floor){G.selectedRoomId=null;G.selected={kind:"hall",gx:gx,gy:gy,floor:floor};closeDrawer();refreshSelInfo();renderStage();scheduleCenterOn(gx+0.5,gy+0.5);}
function hideSel(){G.selectedRoomId=null;G.selected=null;var b=document.getElementById("selInfo");if(b)b.style.display="none";renderStage();}
/* Rotate a placed room or the lobby in place: the door walks to the
   next side (N → E → S → W). The footprint itself does not change —
   in this game rotation has always been about which way the door
   faces — so it always fits where the thing already stands. */
function rotateSelectedInPlace(){
  var sel=G.selected; if(!sel)return;
  if(sel.kind==="room"){
    var r=byId(sel.id); if(!r)return;
    r.rot=((r.rot||0)+1)%4;
    feed("Rotated the <b>"+ROOM_TYPES[r.type].name+"</b> on Floor "+r.floor+" — its door now faces <b>"+ROT_NAMES[r.rot]+"</b>.");
    toast("Door now faces "+ROT_NAMES[r.rot]);
  }else if(sel.kind==="lobby"){
    G.lobbyRot=((G.lobbyRot||2)+1)%4;
    feed("Rotated the <b>lobby</b> — its door now faces <b>"+ROT_NAMES[G.lobbyRot]+"</b>.");
    toast("Lobby door now faces "+ROT_NAMES[G.lobbyRot]);
  }else if(sel.kind==="dining"){
    G.diningRot=((G.diningRot||2)+1)%4;
    feed("Rotated the <b>dining area</b> — its door now faces <b>"+ROT_NAMES[G.diningRot]+"</b>.");
    toast("Dining door now faces "+ROT_NAMES[G.diningRot]);
  }else{toast("Only rooms, the lobby and the dining area rotate — their doors face a direction.");return;}
  rebuildScene();refreshSelInfo();
}
function removeSelected(){
  var sel=G.selected; if(!sel)return;
  if(sel.kind==="vertical"){
    var v=verticalAt(sel.gx,sel.gy); if(!v)return;
    if(!armCheck("vertical:"+v.gx+","+v.gy)){toast("Remove this "+VERTICAL_TYPES[v.kind].name+"? Tap Remove again to confirm — you get $0 back. Upper floors will lose their way up.");refreshSelInfo();return;}
    G.verticals=(G.verticals||[]).filter(function(x){return x!==v;});
    feed("Removed the <b>"+VERTICAL_TYPES[v.kind].name+"</b> — $0 back.");
    toast("Shaft removed — $0 back."); hideSel(); rebuildScene(); updateHUD(); return;
  }
  if(sel.kind==="amenity"){
    var key=sel.key,a=AMENITIES[key];
    if(!armCheck("amenity:"+key)){toast("Remove the "+a.name+"? Tap Remove again to confirm — you get $0 back.");refreshSelInfo();return;}
    G.amenities[key]=0; if(G.amenitySpots)delete G.amenitySpots[key];
    feed("Removed the <b>"+a.name+"</b> — $0 back. Its tiles are clear to build on again.");
    toast(a.name+" removed — $0 back."); hideSel(); rebuildScene(); updateHUD(); return;
  }
  if(sel.kind==="dining"){
    if(!armCheck("dining")){toast("Remove the dining area? Tap Remove again to confirm — you get $0 back. Breakfast stays unlocked; you can place the container again free.");refreshSelInfo();return;}
    G.diningGx=null; G.diningGy=null;
    feed("Removed the <b>Breakfast / Dining area</b> container — $0 back. Its tiles are clear again.");
    toast("Dining area removed — $0 back."); hideSel(); rebuildScene(); updateHUD(); return;
  }
  if(sel.kind==="hall"){
    if(!armCheck("hall:"+sel.floor+","+sel.gx+","+sel.gy)){toast("Remove this hallway tile? Tap Remove again to confirm.");refreshSelInfo();return;}
    delete G.hallTiles[hallKey(sel.floor,sel.gx,sel.gy)];
    feed("Removed a <b>hallway tile</b> on Floor "+sel.floor+".");
    hideSel(); rebuildScene(); updateHUD(); return;
  }
}
/* Start MOVE mode for the selected thing: the placement flow takes
   over (tap a spot for the outline, ⟳ rotates rooms/lobby, hold 1s
   to drop it there). Nothing changes until the hold completes, so
   cancelling leaves the thing exactly where it was. Free — moving
   your own furniture is not a purchase. */
function startMoveSelected(){
  var sel=G.selected; if(!sel)return;
  if(sel.kind==="room"){
    var r=byId(sel.id); if(!r)return;
    if(r.state==="occupied"){toast("Can't move a room with a guest in it — wait for checkout.");return;}
    startMove({moveKind:"room",roomId:r.id,label:ROOM_TYPES[r.type].name+" (Floor "+r.floor+")",w:roomW(r),h:roomH(r),rot:r.rot||0,floor:r.floor,fromGx:r.gx,fromGy:r.gy});
  }else if(sel.kind==="lobby"){
    if(G.lobby===0||G.lobbyGx==null)return;
    startMove({moveKind:"lobby",label:LOBBY_TIERS[G.lobby].name+" — Lobby (container)",w:lobbyW(),h:lobbyH(),rot:G.lobbyRot||2,floor:1,fromGx:G.lobbyGx,fromGy:G.lobbyGy});
  }else if(sel.kind==="dining"){
    if(G.diningGx==null)return;
    startMove({moveKind:"dining",label:"Breakfast / Dining area (container)",w:diningW(),h:diningH(),rot:0,floor:1,fromGx:G.diningGx,fromGy:G.diningGy});
  }else if(sel.kind==="vertical"){
    var v=verticalAt(sel.gx,sel.gy); if(!v)return;
    startMove({moveKind:"vertical",label:VERTICAL_TYPES[v.kind].name,w:2,h:2,rot:0,floor:1,fromGx:v.gx,fromGy:v.gy});
  }else if(sel.kind==="amenity"){
    var spot=(G.amenitySpots||{})[sel.key]; if(!spot)return;
    startMove({moveKind:"amenity",amenKey:sel.key,label:AMENITIES[sel.key].name,w:spot.w,h:spot.h,rot:0,floor:spot.floor,fromGx:spot.gx,fromGy:spot.gy});
  }else{toast("Hallway tiles can't be moved — remove this tile and lay a new one from Build.");}
}
/* ---------- Live menu refresh ----------
   Menus used to be rendered ONCE, when opened, and never again —
   so a room menu opened on an occupied room still showed no Clean
   button after the guest checked out, until you closed and
   reopened it. Now every open menu carries a SIGNATURE: a short
   string summarising exactly the state its contents are drawn
   from. refreshOpenMenus() recomputes the signatures and re-renders
   a menu ONLY when its signature has changed — a real state change
   (checkout, check-in, a cleaner finishing, a repair, a day
   rolling over, cash moving an affordability disable, a two-tap
   confirm expiring) updates the open menu in place, while an
   unchanged menu is never touched, so nothing flickers, scroll
   positions survive, and a tap in flight is never disturbed.
   The poll is updateHUD (after nearly every action, and twice a
   second while playing); checkout and check-in also call it
   directly so their change lands the same moment it happens. */
var lastSelSig="__none__",lastPanelSig="__none__";
function selSignature(){
  var sel=G.selected;
  if(!sel)return "none";
  if(sel.kind==="room"){
    var r=byId(sel.id);
    if(!r)return "room:gone:"+sel.id;
    return ["room",r.id,r.state,r.deepDue?1:0,r.repairKind||"",Math.round(r.condition),r.nightsLeft||0,
      r.guest?(r.guest.arch.key+"|"+(r.guest.desire||"")):"",r.bed,r.bath,r.tv,r.furn,r.finish,
      r.rot||0,r.gx,r.gy,r.floor,priceFor(r),roomAppeal(r),
      (demolishArmId===r.id&&Date.now()-demolishArmAt<=8000)?1:0].join("|");
  }
  if(sel.kind==="lobby")return ["lobby",G.lobby,lobbyW(),lobbyH(),G.lobbyRot||2].join("|");
  if(sel.kind==="dining")return ["dining",G.breakfast,diningW(),diningH(),G.diningRot||2,G.diningGx==null?0:1,
    (modifyArm.key==="dining"&&Date.now()-modifyArm.at<=8000)?1:0].join("|");
  if(sel.kind==="vertical"){
    var v=verticalAt(sel.gx,sel.gy);
    return ["vertical",sel.gx,sel.gy,v?v.kind:"gone",G.floors,
      (modifyArm.key==="vertical:"+sel.gx+","+sel.gy&&Date.now()-modifyArm.at<=8000)?1:0].join("|");
  }
  if(sel.kind==="amenity"){
    var spot=(G.amenitySpots||{})[sel.key];
    return ["amenity",sel.key,G.amenities[sel.key]||0,spot?(spot.floor+","+spot.gx+","+spot.gy+","+spot.w+"x"+spot.h):"gone",
      (modifyArm.key==="amenity:"+sel.key&&Date.now()-modifyArm.at<=8000)?1:0].join("|");
  }
  if(sel.kind==="hall")return ["hall",sel.floor,sel.gx,sel.gy,hasHall(sel.floor,sel.gx,sel.gy)?1:0,
    (modifyArm.key==="hall:"+sel.floor+","+sel.gx+","+sel.gy&&Date.now()-modifyArm.at<=8000)?1:0].join("|");
  return sel.kind;
}
function panelSignature(){
  var tab=G.tab;
  if(tab==="rooms"){
    return "rooms|"+Math.floor(G.cash)+"|"+(unlimitedCash()?1:0)+"|"+
      (demolishArmId!=null&&Date.now()-demolishArmAt<=8000?demolishArmId:0)+"|"+
      G.rooms.map(function(r){return [r.id,r.type,r.floor,r.slot,r.gx,r.gy,r.state,r.deepDue?1:0,r.repairKind||"",
        Math.round(r.condition),r.stays,r.nightsLeft||0,r.bed,r.bath,r.tv,r.furn,r.finish,priceFor(r),roomAppeal(r)].join(",");}).join(";");
  }
  if(tab==="build"){
    var counts={}; G.rooms.forEach(function(r){counts[r.type]=(counts[r.type]||0)+1;});
    return ["build",Object.keys(G.hallTiles||{}).length,connectedCount(),G.lobby,lobbyW(),lobbyH(),
      G.diningGx==null?0:1,G.breakfast,G.floors,(G.verticals||[]).map(function(v){return v.kind;}).join("+"),
      Object.keys(AMENITIES).map(function(k){var sp=(G.amenitySpots||{})[k];return G.amenities[k]+(sp?"@"+sp.floor:"");}).join(","),
      Object.keys(ROOM_TYPES).map(function(k){return counts[k]||0;}).join(",")].join("|");
  }
  if(tab==="staff"){
    return ["staff",Object.keys(STAFF_ROLES).map(function(k){return G.staff[k];}).join(","),
      G.rooms.filter(function(r){return r.state==="dirty";}).length,
      G.rooms.filter(function(r){return r.state==="broken";}).length,monthlyCosts().wages].join("|");
  }
  if(tab==="ledger"){
    var t=trailing30();
    return ["ledger",G.day,t.roomInc,t.feeInc,t.eventInc,t.costs,t.nights,t.checkedIn,t.turnNoRoom,t.turnNoPath,
      t.turnStandard,t.turnPrice,t.turnParty,monthlyCosts().total,hotelAppeal(),G.rooms.length,G.floors].join("|");
  }
  if(tab==="feed"){
    return "feed|"+G.feed.length+"|"+(G.feed.length?(G.feed[0].day+"~"+G.feed[0].html):"");
  }
  if(tab==="prices"){
    var t30=trailing30();
    return ["prices",JSON.stringify(G.priceByType),JSON.stringify(G.fees),G.breakfastMode,G.breakfast,
      G.staff.manager,t30.turnPrice,t30.checkedIn,Math.round(t30.occupancy*100)].join("|");
  }
  return tab;
}
function refreshOpenMenus(){
  if(!G)return;
  /* The tap-a-thing MODIFY menu (#selInfo) */
  if(selSignature()!==lastSelSig){
    var boxEl=document.getElementById("selInfo");
    var st=boxEl?boxEl.scrollTop:0;
    refreshSelInfo();
    if(boxEl&&boxEl.style.display!=="none")boxEl.scrollTop=st; /* keep the reader's place in a scrolled menu */
  }
  /* The management drawer — only while it is actually open, and
     never over the top of a field the player is editing (a price
     slider being dragged, a fee box being typed in): a skipped
     refresh simply lands on the next poll after the edit ends,
     because the stored signature stays stale until then. */
  var side=document.getElementById("side");
  if(side&&side.classList.contains("open")&&panelSignature()!==lastPanelSig){
    var pb=document.getElementById("panelBody");
    var act=document.activeElement;
    var editing=!!(act&&pb&&pb.contains(act)&&(act.tagName==="INPUT"||act.tagName==="SELECT"||act.tagName==="TEXTAREA"));
    if(!editing){
      var pst=pb?pb.scrollTop:0;
      renderPanel();
      if(pb)pb.scrollTop=pst;
    }
  }
}

  }else if(sel.kind==="vertical"){

  }else if(sel.kind==="amenity"){

    var sz=n?amenitySize(key,cur+1):null;

    var ua=document.getElementById("selUpAmen"); if(ua)ua.addEventListener("click",function(){buyAmenity(key);refreshSelInfo();});
  }else if(sel.kind==="hall"){

function syncViewButtons(){ /* one view only — nothing to switch */ }
function initScene(){
  var wrap=document.getElementById("sceneWrap");
  var stage=document.createElement("div");stage.id="stage";
  stage.innerHTML='<div class="stageBox" id="stageBox"><div id="camRoot"><div id="isoStage"><canvas id="isoCanvas" width="480" height="300"></canvas></div><div id="shade"></div><div id="peopleLayer"></div></div><div id="caption"></div></div>';
  wrap.insertBefore(stage,wrap.firstChild);
  stageBox=document.getElementById("stageBox");isoStage=document.getElementById("isoStage");
  camRoot=document.getElementById("camRoot");
  cv=document.getElementById("isoCanvas");cxg=cv.getContext("2d");
  cv.addEventListener("click",canvasClick);
  cv.addEventListener("pointerdown",placementPointerDown);
  cv.addEventListener("pointerup",placementPointerUp);
  cv.addEventListener("pointerleave",placementPointerUp);
  cv.addEventListener("pointercancel",placementPointerUp);
  var pc=document.getElementById("btnPlaceCancel"); if(pc)pc.addEventListener("click",cancelPlacement);
  var rt=document.getElementById("btnRotate"); if(rt)rt.addEventListener("click",function(e){e.stopPropagation();rotatePlacement();});
  document.addEventListener("keydown",function(e){if(PLACE&&(e.key==="r"||e.key==="R"))rotatePlacement(); if(e.key==="Escape"&&PLACE)cancelPlacement();});
  /* --- zoom & pan: wheel, pinch and drag (no on-screen zoom menu) --- */
  wrap.addEventListener("wheel",function(e){e.preventDefault();setCamZ(camZ*Math.exp(-e.deltaY*0.0012));},{passive:false});
  var ptrs={},panId=null,panLX=0,panLY=0,panSX=0,panSY=0,panning=false,pinchD=0,pinchCX=0,pinchCY=0;
  wrap.addEventListener("pointerdown",function(e){
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    var ids=Object.keys(ptrs);
    if(ids.length===2){
      var a=ptrs[ids[0]],b2=ptrs[ids[1]];
      pinchD=Math.hypot(a.x-b2.x,a.y-b2.y);pinchCX=(a.x+b2.x)/2;pinchCY=(a.y+b2.y)/2;
      stopHold();suppressClickUntil=Date.now()+300;
    }else if(ids.length===1){panId=e.pointerId;panLX=panSX=e.clientX;panLY=panSY=e.clientY;panning=false;}
  });
  wrap.addEventListener("pointermove",function(e){
    if(!ptrs[e.pointerId])return;
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    var ids=Object.keys(ptrs);
    if(ids.length===2){
      var a=ptrs[ids[0]],b2=ptrs[ids[1]];
      var d=Math.hypot(a.x-b2.x,a.y-b2.y),cx2=(a.x+b2.x)/2,cy2=(a.y+b2.y)/2;
      if(pinchD>0&&d>0)setCamZ(camZ*d/pinchD);
      camX+=cx2-pinchCX;camY+=cy2-pinchCY;applyCam();
      pinchD=d;pinchCX=cx2;pinchCY=cy2;suppressClickUntil=Date.now()+300;
    }else if(e.pointerId===panId){
      var dx=e.clientX-panLX,dy=e.clientY-panLY;
      if(!panning&&Math.hypot(e.clientX-panSX,e.clientY-panSY)>10){panning=true;stopHold();}
      if(panning){camX+=dx;camY+=dy;applyCam();suppressClickUntil=Date.now()+250;}
      panLX=e.clientX;panLY=e.clientY;
    }
  });
  function ptrEnd(e){delete ptrs[e.pointerId];if(e.pointerId===panId){panId=null;panning=false;}if(Object.keys(ptrs).length<2)pinchD=0;}
  wrap.addEventListener("pointerup",ptrEnd);
  wrap.addEventListener("pointercancel",ptrEnd);
  peopleLayer=document.getElementById("peopleLayer");
  shadeEl=document.getElementById("shade");captionEl=document.getElementById("caption");
  sceneReady=true;
  var _lb=document.getElementById("btnLobbyView"); if(_lb)_lb.addEventListener("click",function(){G.view="floor";syncViewButtons();rebuildScene();updateHUD();});
  window.addEventListener("resize",function(){syncHudOffset();rebuildScene();});
  renderStage();
  var last=performance.now();
  (function loop(now){
    requestAnimationFrame(loop);
    var dt=Math.min(0.05,(now-last)/1000);last=now;
    try{
      tickPeople(G.paused?0:dt*(G.speed===3?1.6:1));
      tickCleaners(G.paused?0:dt*(G.speed===3?1.6:1));
      var warm=Math.max(0,(G.dayT-0.45))*1.4;
      shadeEl.style.opacity=Math.min(0.4,warm).toFixed(2);
    }catch(err){window.onerror(err.message,"render",0);}
  })(last);
}
/* ================= Main loop & wiring ================= */
var staffT=0,hudT=0;
setInterval(function(){
  if(!G.started||G.paused)return;
  var step=0.1*G.speed;
  G.dayT+=step/DAY_SECONDS;
  /* arrivals spread across the day */
  G.spawnT-=step;
  if(G.spawnT<=0){
    var perDay=arrivalsPerDay();
    G.spawnT=(DAY_SECONDS/Math.max(1,perDay))*(0.6+Math.random()*0.9);
    if(walkers.length<6)guestArrives();
  }
  staffT+=step;
  if(staffT>=4){staffT=0;if(jobsCount()>0)staffWork();}
  if(G.dayT>=1){G.dayT=0;endOfDay();}
  hudT+=step;
  if(hudT>=0.5){hudT=0;updateHUD();}
},100);

function setSpeed(s,paused){
  G.speed=s;G.paused=paused;
  document.getElementById("btn1x").classList.toggle("on",!paused&&s===1);
  document.getElementById("btn3x").classList.toggle("on",!paused&&s===3);
  document.getElementById("btnPause").classList.toggle("on",paused);
}

document.getElementById("btn1x").addEventListener("click",function(){setSpeed(1,false);});
document.getElementById("btn3x").addEventListener("click",function(){setSpeed(3,false);});

  document.body.classList.add("started"); /* the Build tab only exists once the game has started — never on the start screen */
  G.started=true;
  syncHudOffset();

  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  sfx("chime");
  if(resumedGame){
    feed("Welcome back — your hotel is just as you left it, on <b>Day "+G.day+"</b>.");
    toast("Welcome back — Day "+G.day);

    toast("Day 1");

  saveGame();
});

document.getElementById("btnNewGame").addEventListener("click",requestNewGame);

/* Boot: load any saved hotel BEFORE the first render, so the scene
   behind the intro is the player's real hotel, not a fresh one. */
var bootSave=readSave();
if(bootSave){try{applySave(bootSave);}catch(e){bootSaveFound=false;resumedGame=false;}}
initScene();
drawIntro();
updateHUD();
renderPanel();
updateIntroForSave(bootSaveFound?bootSave:null);
requestAnimationFrame(function(){syncHudOffset();});
</script>
