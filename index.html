<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>Hotel Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Mono:wght@500;700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  --hudH:64px;
  color-scheme: light;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --paper:#fffdf4; --paper2:#faf5e6; --ink:#26332e; --muted:#6d7263;
  --teal-head:#0d3b3c; --teal-bar:#0c3436; --teal:#14706a; --teal-btn:#125c57;
  --gold:#c9902e; --gold-b:#e9b44c; --orange:#b45f16;
  --line:#ddd3ba; --line2:#e7dfc9;
  --chip:#f3ecd4; --good:#1d7a3a; --bad:#b23a2a; --warn:#9a6a10;
  --card-shadow:0 1px 4px rgba(60,50,20,.10);
  --overlay:rgba(255,253,244,.97); --overlay-line:#c9902e;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--teal-bar);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;}
button,[role="button"],select,input{min-height:2.25rem;font-family:inherit;}
button{cursor:pointer;border:1px solid var(--teal);background:#fffef9;color:var(--teal-btn);border-radius:3px;padding:.35rem .6rem;font-weight:700;font-size:.82rem;}
button:hover{border-color:var(--gold);color:var(--ink);}
button:disabled{opacity:.38;cursor:not-allowed;}
button.primary{background:var(--gold-b);border-color:var(--gold);color:#2a1a05;font-family:var(--serif);letter-spacing:.02em;}
button.danger{background:transparent;color:var(--bad);border-color:var(--bad);}
button.on{background:var(--teal-head);border-color:var(--teal-head);color:#fff6d6;}
input[type=range]{accent-color:var(--gold);width:100%;}
input[type=number],select{background:#fffef9;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:.3rem .45rem;font-family:"IBM Plex Mono",monospace;}
.mono{font-family:"IBM Plex Mono",monospace;}
#app{position:relative;height:100dvh;overflow:hidden;}
/* HUD — the PDF cover bar: deep teal, gold rule, cream type */
#hud{position:absolute;top:0;left:0;right:0;z-index:45;display:flex;flex-wrap:wrap;gap:.35rem .9rem;align-items:center;padding:.5rem .7rem;background:rgba(12,52,54,.94);border-bottom:3px solid var(--gold);font-size:.85rem;color:#fff6d6;}
#hud .stat{display:flex;gap:.35rem;align-items:baseline;white-space:nowrap;}
#hud .lab{color:#b9d2c8;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
#hud .val{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:1rem;color:#fff6d6;}
#hud .val.neg{color:#ff9a8a;} #hud .val.pos{color:#ffe9a8;}
#eraTag{background:var(--gold-b);color:#2a1a05;border-radius:2px;padding:.18rem .55rem;font-weight:900;font-size:.72rem;font-family:var(--serif);letter-spacing:.06em;}
#speedCtl{margin-left:auto;display:flex;gap:.3rem;align-items:center;}
#speedCtl button{min-width:2.6rem;background:#17494a;border-color:#2f6f6a;color:#fff6d6;}
#speedCtl button.on{background:var(--gold-b);border-color:var(--gold);color:#2a1a05;}
/* Layout — there is no viewport box: the scene IS the whole screen,
   edge to edge, and every menu (HUD, floor buttons, drawer) floats
   over it. */
#main{position:absolute;inset:0;display:flex;min-height:0;}
#sceneWrap{flex:1;position:relative;min-width:0;background:#081f20;overflow:hidden;}
#stage{position:absolute;inset:0;}
.stageBox{position:absolute;inset:0;width:100%;height:100%;background:#0a2a2b;overflow:hidden;}
/* The camera moves the land across the full screen; zoom and pan never
   resize any frame, because there is no frame — just the screen.
   NATIVE SIZE RULE: camRoot is the world box, sized in JS to exactly
   the world's logical size (CVW x CVH CSS px) and centred on the
   screen, so at 100% zoom the world shows at its full logical size —
   rooms are NEVER downscaled to fit the screen or the plot. A world
   bigger than the screen overflows and is reached by panning /
   zooming, not by shrinking the art.
   RESOLUTION RULE: the canvas BACKING STORE is RS times the logical
   size (see computeRenderScale) and the 2D context is scaled by RS,
   so every room, tile and label is rasterised at full device
   resolution — several backing pixels per CSS pixel — instead of a
   low-resolution bitmap being upscaled by the display. */
#camRoot{position:absolute;left:50%;top:50%;transform-origin:center center;}
#isoStage{position:absolute;inset:0;}
#isoCanvas{display:block;width:100%;height:100%;cursor:pointer;}
#shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,166,66,.20),rgba(16,32,72,.28));opacity:0;transition:opacity .6s;}
#peopleLayer{position:absolute;inset:0;pointer-events:none;}
#caption{position:absolute;left:.5rem;bottom:.5rem;background:rgba(12,52,54,.92);color:#fff6d6;border:1px solid var(--gold);border-radius:3px;padding:.3rem .55rem;font-size:.72rem;font-weight:700;pointer-events:none;z-index:5;}
/* People sprites */
.walker{position:absolute;width:var(--pw,44px);margin-left:calc(var(--pw,44px)/-2);margin-top:calc(var(--pw,44px)*-1.34);pointer-events:none;z-index:4;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45));}
/* A room occupant is the SAME .walker sprite element as the guest who
   walked to the door — identical SVG, size and anchoring — just
   standing still inside their room instead of walking. */
.walker.occupant{z-index:4;}
.walker .fig{display:block;}
.walker.flip .fig{transform:scaleX(-1);}
/* Painted character sprites: a .fig.char is one cell of a sprite
   strip (background-position picks the direction / walk frame).
   The cell aspect is the same 48:68 as the procedural figure it
   replaces, so the existing size and feet anchoring are unchanged. */
.fig.char{display:block;width:100%;aspect-ratio:48/68;background-repeat:no-repeat;}
.bubble{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:2px;background:rgba(12,52,54,.95);border:1px solid var(--gold);color:#ffd97a;border-radius:6px;padding:.18rem .45rem;font-size:.7rem;font-weight:800;white-space:nowrap;}
.bubble.bad{color:#ff9a8a;}
.staffFig{position:absolute;width:var(--pw,42px);margin-left:calc(var(--pw,42px)/-2);margin-top:calc(var(--pw,42px)*-1.30);pointer-events:none;z-index:3;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));}
/* View + floor controls, PDF teal & gold */
#floorCtl{position:absolute;right:.55rem;top:calc(var(--hudH,64px) + 10px);display:flex;flex-direction:column;gap:.35rem;align-items:stretch;z-index:40;}
#floorCtl .fl{max-height:46dvh;overflow-y:auto;}
#floorCtl>button{background:rgba(12,52,54,.92);color:#fff6d6;border-color:var(--gold);}
#floorCtl .fl{display:flex;flex-direction:column;gap:.25rem;background:rgba(12,52,54,.92);border:1px solid var(--gold);padding:.35rem;border-radius:4px;}
#floorCtl .fl button{color:#fff6d6;background:#17494a;border-color:#2f6f6a;min-height:2.1rem;font-size:.75rem;}
#floorCtl .fl button.cur{background:var(--gold-b);color:#2a1a05;border-color:var(--gold);}
#floorCtl .dot{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;margin-left:.3rem;vertical-align:middle;}
#selInfo{position:absolute;left:.55rem;bottom:.55rem;max-width:min(92%,430px);background:var(--overlay);color:var(--ink);border:1px solid var(--overlay-line);border-left:4px solid var(--gold);border-radius:4px;padding:.55rem .7rem;font-size:.8rem;z-index:5;display:none;box-shadow:0 6px 22px rgba(0,0,0,.35);}
#selInfo b{color:var(--teal-head);font-family:var(--serif);}
#selInfo .row{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.4rem;}
#selInfo button{min-height:2.1rem;}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--hudH,64px) + 10px);background:rgba(12,52,54,.95);color:#ffd97a;border:1px solid var(--gold);padding:.45rem .85rem;border-radius:4px;font-weight:700;font-size:.85rem;z-index:46;display:none;max-width:92%;text-align:center;}
#placeBar{position:absolute;left:50%;transform:translateX(-50%);bottom:.55rem;width:min(94%,560px);background:rgba(12,52,54,.97);color:#fff6d6;border:2px solid var(--gold);border-radius:6px;padding:.55rem .7rem;z-index:8;display:none;box-shadow:0 8px 28px rgba(0,0,0,.5);}
#placeBar b{color:#ffd97a;font-family:var(--serif);}
#placeBar .pRow{display:flex;gap:.5rem;align-items:center;justify-content:space-between;flex-wrap:wrap;}
#placeBar .pHint{font-size:.78rem;line-height:1.4;margin-top:.25rem;color:#e8dfc2;}
#holdWrap{height:.55rem;background:#0a2422;border:1px solid var(--gold);border-radius:3px;overflow:hidden;margin-top:.45rem;display:none;}
#holdFill{height:100%;width:0%;background:var(--gold-b);transition:width .05s linear;}
#placeBar button{background:var(--gold-b);border-color:var(--gold);color:#2a1a05;min-height:2rem;}
/* Upgrade / management drawer — hidden by default so the scene gets the
   full screen. Slides in from the right covering 75% of the screen when
   you tap a room, an empty plot, the desk or the Menu button. */
#side{position:absolute;top:0;right:0;bottom:0;width:75%;max-width:none;min-width:0;display:none;flex-direction:column;background:var(--paper);border-left:2px solid var(--gold);min-height:0;z-index:60;transform:translateX(103%);transition:transform .28s ease;box-shadow:-14px 0 38px rgba(0,0,0,.5);}
#side.open{display:flex;transform:translateX(0);}
#drawerHead{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.5rem .65rem;background:var(--teal-bar);color:#fff6d6;border-bottom:3px solid var(--gold);}
#drawerHead b{font-family:var(--serif);font-size:1rem;letter-spacing:.02em;}
#drawerHead button{background:var(--gold-b);border-color:var(--gold);color:#2a1a05;min-height:2.2rem;}
#btnMenu{background:var(--gold-b);border-color:var(--gold);color:#2a1a05;font-weight:900;}
#tabs{display:flex;flex-wrap:wrap;gap:.3rem;padding:.55rem .55rem .4rem;background:var(--paper2);border-bottom:2px solid var(--gold);}
#tabs button{flex:1 1 30%;}
#tabs button.on{background:var(--teal-head);color:#fff6d6;border-color:var(--teal-head);font-family:var(--serif);}
#panelBody{flex:1;overflow-y:auto;padding:.35rem .65rem 1rem;min-height:0;background:var(--paper);}
#drawerFoot{border-top:2px solid var(--gold);background:var(--paper2);padding:.5rem .65rem;display:flex;flex-direction:row;flex-wrap:wrap;gap:.45rem;align-items:center;}
#drawerFoot button{flex:1 1 auto;}
#btnNewGame.armed{background:var(--bad);border-color:var(--bad);color:#fff;}
#saveSummary{display:none;background:rgba(233,180,76,.14);border:1px solid var(--gold);border-radius:3px;padding:.55rem .7rem;margin:.55rem 0 .2rem;font-size:.85rem;line-height:1.45;color:#fff6d6;}
#saveSummary b{color:var(--gold-b);font-family:"IBM Plex Mono",monospace;}
#btnNewGameIntro{display:none;width:100%;margin-top:.5rem;background:transparent;border-color:#c98a6b;color:#f0c9b8;min-height:2.5rem;}
#btnNewGameIntro.armed{background:var(--bad);border-color:var(--bad);color:#fff;}
#panelBody h3{margin:.95rem 0 .45rem;font-size:.76rem;letter-spacing:.13em;text-transform:uppercase;color:var(--teal);font-weight:900;border-bottom:2px solid var(--gold);padding-bottom:.3rem;}
#panelBody h3:first-child{margin-top:.25rem;}
.card{background:#fffef9;border:1px solid var(--line2);border-radius:3px;padding:.6rem .7rem;margin-bottom:.55rem;box-shadow:var(--card-shadow);}
.card .t{font-weight:800;font-size:1rem;display:flex;justify-content:space-between;gap:.5rem;align-items:baseline;font-family:var(--serif);color:var(--teal-head);letter-spacing:.01em;}
.card .sub{color:#4c554d;font-size:.79rem;margin-top:.15rem;line-height:1.4;}
.card .row{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.45rem;align-items:center;}
.pill{display:inline-block;background:var(--chip);color:var(--teal-head);border-radius:2px;padding:.08rem .45rem;font-size:.72rem;font-weight:700;font-family:"IBM Plex Mono",monospace;}
.pill.good{color:var(--good);} .pill.bad{color:var(--bad);} .pill.warn{color:var(--warn);}
.bar{height:.5rem;background:var(--chip);border-radius:2px;overflow:hidden;margin-top:.35rem;}
.bar>i{display:block;height:100%;background:var(--teal);}
.bar>i.low{background:var(--bad);} .bar>i.mid{background:var(--gold-b);}
table{width:100%;border-collapse:collapse;font-size:.8rem;}
th,td{padding:.32rem .35rem;text-align:right;border-bottom:1px solid var(--line2);}
th:first-child,td:first-child{text-align:left;}
th{background:var(--teal-head);color:#fff;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;}
tr:nth-child(even) td{background:#faf6ea;}
#feed{font-size:.79rem;line-height:1.45;}
#feed div{padding:.3rem 0;border-bottom:1px dashed var(--line);}
#feed .why{color:var(--muted);}
.kv{display:flex;justify-content:space-between;font-size:.82rem;padding:.24rem 0;border-bottom:1px dashed var(--line);}
.kv b{font-family:"IBM Plex Mono",monospace;}
.note{font-size:.79rem;color:#4c554d;line-height:1.5;}
.big{font-size:1.05rem;font-weight:900;}
input[type=range]{min-height:2rem;}
.priceRow{display:grid;grid-template-columns:1fr auto;gap:.2rem .6rem;align-items:center;margin-bottom:.4rem;}
.priceRow .pv{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:1.05rem;color:var(--orange);}
/* Intro — a replica of the design PDF's cover page */
#intro{position:fixed;inset:0;background:#0c3436;display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem;overflow-y:auto;}
#introCard{background:#0d3b3c;border:2px solid var(--gold);border-radius:4px;max-width:600px;width:100%;padding:1.25rem 1.35rem 1.2rem;max-height:94dvh;overflow-y:auto;color:#fff6d6;box-shadow:0 18px 50px rgba(0,0,0,.5);}
#introCard .kicker{font-size:.68rem;font-weight:900;letter-spacing:.28em;color:var(--gold-b);text-transform:uppercase;margin:0 0 .5rem;}
#introCard h1{margin:.1rem 0 .3rem;font-size:2.7rem;line-height:.98;font-family:var(--serif);font-weight:900;color:#ffffff;}
#introCard h1 span{display:block;}
#introCard .rule{width:8rem;height:4px;background:var(--gold);margin:.65rem 0 .75rem;}
#introCard p{font-size:.93rem;line-height:1.55;color:#f2e6c2;}
#introCard figure{margin:.4rem 0 .2rem;}
#introCard figure img{display:block;width:100%;border:3px solid var(--gold);image-rendering:pixelated;}
#introCard figcaption{font-size:.72rem;color:#b9d2c8;margin-top:.35rem;line-height:1.4;}
#introCard .stats{display:flex;gap:1.4rem;flex-wrap:wrap;margin:.7rem 0 .2rem;}
#introCard .stats div b{display:block;font-family:var(--serif);font-size:1.7rem;color:var(--gold-b);font-weight:800;line-height:1;}
#introCard .stats div span{font-size:.72rem;color:#e8dfc2;line-height:1.3;display:block;max-width:9.5rem;margin-top:.2rem;}
#introCard ul{font-size:.86rem;line-height:1.55;padding-left:1.1rem;margin:.5rem 0;color:#fff6d6;}
#introCard ul b{color:var(--gold-b);}
#errBox{position:fixed;left:.5rem;bottom:.5rem;z-index:99;background:#5b1710;color:#ffd9d2;padding:.5rem .7rem;border-radius:4px;font-size:.78rem;display:none;max-width:90vw;}
/* Build tab — hugs the right edge of the screen, "Build" printed
   vertically in it. This is the ONLY way into the Build menu;
   upgrading / modifying lives in the separate tap-a-thing menu. */
#buildTab{display:none;position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:55;writing-mode:vertical-rl;text-orientation:mixed;background:var(--gold-b);color:#2a1a05;border:2px solid var(--gold);border-right:none;border-radius:7px 0 0 7px;padding:1.1rem .5rem;font-family:var(--serif);font-weight:900;font-size:1.05rem;letter-spacing:.38em;box-shadow:-4px 0 16px rgba(0,0,0,.4);min-height:8rem;text-align:center;}
body.started #buildTab{display:block;}
#buildTab:hover{background:var(--gold);color:#2a1a05;}
#buildTab.on{background:var(--teal-head);color:#fff6d6;border-color:var(--gold);}
/* Modify menu — appears only when you tap something already placed.
   Separate from the Build drawer on purpose. */
#selInfo{max-height:74dvh;overflow-y:auto;width:min(92%,430px);}
#selInfo .modBtns{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.45rem;}
#selInfo .modBtns button.primary{background:var(--gold-b);border-color:var(--gold);color:#2a1a05;}
.stageBox{transform-origin:center center;touch-action:none;}
#sceneWrap{touch-action:none;}
@media (max-width:820px){
  #sceneWrap{flex:1;height:auto;}
  #side{width:75%;}
  #hud{font-size:.78rem;gap:.3rem .6rem;}
}

</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span id="eraTag">ERA 1 · FIRST ROOM</span>
    <span class="stat"><span class="lab">Cash</span><span class="val" id="hCash">$0</span></span>
    <span class="stat"><span class="lab">Day</span><span class="val" id="hDay">1</span></span>
    <span class="stat"><span class="lab">Stars</span><span class="val" id="hStars">—</span></span>
    <span class="stat"><span class="lab">Appeal</span><span class="val" id="hAppeal">0</span></span>
    <span class="stat"><span class="lab">Occupied</span><span class="val" id="hOcc">0/1</span></span>
    <span class="stat"><span class="lab">Jobs</span><span class="val" id="hJobs">0</span></span>
    <span id="speedCtl">
      <button id="btnMenu" title="Management — rooms list, prices, staff, ledger, guests (building is the Build tab on the right edge)">☰ Menu</button>
      <button id="btnPause" title="Pause">❚❚</button>
      <button id="btn1x" class="on">1×</button>
      <button id="btn3x">3×</button>
    </span>
  </div>
  <div id="main">
    <div id="sceneWrap">
      <div id="toast"></div>
      <div id="placeBar" role="status" aria-live="polite">
        <div class="pRow"><span id="placeLabel"><b>Placing</b></span><span style="display:flex;gap:.4rem;align-items:center;"><button id="btnRotate" title="Rotate the door to face another direction (or press R)">⟳ Rotate door: <span id="rotLabel">South ↓</span></button><button id="btnPlaceCancel">✕ Cancel placement</button></span></div>
        <div class="pHint" id="placeHint">Tap to preview · hold 1s to place.</div>
        <div id="holdWrap"><div id="holdFill"></div></div>
      </div>
      <div id="floorCtl">
        <button id="btnFloorUp">▲ Floor</button>
        <div class="fl" id="floorList"></div>
        <button id="btnFloorDown">▼ Floor</button>
      </div>
      <div id="selInfo"></div>
      <button id="buildTab" title="Open the Build menu — new rooms, hallways, lobby, stairs, amenities">Build</button>
    </div>
    <div id="side">
      <div id="drawerHead"><b id="drawerTitle">Build</b><button id="btnDrawerClose" title="Close menu">✕ Close</button></div>
      <div id="tabs">
        <button data-tab="rooms">Rooms</button>
        <button data-tab="prices">Prices</button>
        <button data-tab="staff">Staff</button>
        <button data-tab="ledger">30-Day</button>
        <button data-tab="feed">Guests</button>
      </div>
      <div id="panelBody"></div>
      <div id="drawerFoot">
        <button id="btnCashMode">Finite cash — unlimited OFF</button>
        <button id="btnNewGame" class="danger">↻ Start new game</button>
      </div>
    </div>
  </div>
</div>

<div id="intro">
  <div id="introCard">
    <h1>HOTEL <span>MASTER</span></h1>
    <div class="rule"></div>
    <figure>
      <canvas id="introCanvas" width="1440" height="675" style="display:block;width:100%;border:3px solid var(--gold);" role="img" aria-label="Pixel-art panorama of the hotel growing from a small shack to twin towers at sunset, with a turquoise pool and fountain"></canvas>
    </figure>
    <div id="saveSummary" role="status"></div>
    <button class="primary" id="btnStart" style="width:100%;font-size:1rem;min-height:2.8rem;">Open for business</button>
    <button id="btnNewGameIntro">Start a new game instead — erase the saved hotel</button>
  </div>
</div>
<div id="errBox"></div>

<script>
window.onerror=function(m,s,l){var e=document.getElementById('errBox');if(e){e.style.display='block';e.textContent='Error: '+m+' (line '+l+')';}return false;};
</script>
<script>
"use strict";
/* ================= HOTEL MASTER — core simulation =================
   Framework first: economy, guests, rooms, staff, ledger.
   The painted view renders this state; it never owns it.      */

/* ---------- Catalog data (from the design doc) ---------- */
/* Room tiers grow TWO tiles at a time from Tier 1 (Single, 3x3):
   each tier expands TWO units in ONE direction from the tier below,
   alternating width then height, so rooms stay somewhat square but
   the larger tiers are noticeably bigger —
   3x3 -> 5x3 -> 5x5 -> 7x5 -> 7x7 -> 9x7 -> 9x9 -> 11x9. */
var ROOM_TYPES={
  single:  {name:"Single / Pod",   sleeps:1, cost:400,  appeal:5,  defPrice:30, w:3, h:3},
  standard:{name:"Standard Double",sleeps:2, cost:900,  appeal:10, defPrice:45, w:5, h:3},
  twin:    {name:"Twin",           sleeps:2, cost:950,  appeal:10, defPrice:45, w:5, h:5},
  family:  {name:"Family",         sleeps:4, cost:1800, appeal:16, defPrice:70, w:7, h:5},
  deluxe:  {name:"Deluxe King",    sleeps:2, cost:2600, appeal:24, defPrice:110,w:7, h:7},
  suite:   {name:"Suite",          sleeps:3, cost:5500, appeal:38, defPrice:180,w:9, h:7},
  grand:   {name:"Grand Suite",    sleeps:4, cost:11000,appeal:55, defPrice:300,w:9, h:9},
  penthouse:{name:"Penthouse",     sleeps:4, cost:28000,appeal:85, defPrice:550,w:11, h:9}
};

/* ---------- Local storage save / load ----------
   The whole game state (G) is kept in this browser's local storage
   so a hotel survives closing the page. It saves automatically —
   debounced from updateHUD (which fires after nearly every action
   and several times a second while playing), on a 2.5s interval,
   and when the page is hidden or closed. On boot, a saved game is
   loaded behind the intro: the intro's main button becomes
   "Continue" and a separate button there — plus "Start new game"
   in the Menu drawer — erases the save and starts over.
   All storage access is wrapped: if local storage is unavailable
   (private mode, blocked storage) the game simply runs in memory
   and says so in the menu, it never breaks. */
var SAVE_KEY="hotel-master-save-v1";

function readSave(){
  var raw=storeGet(); if(!raw)return null;
  try{
    var data=JSON.parse(raw);

    return data;
  }catch(e){return null;}
}
function applySave(data){
  var s=data.state;
  freshState(); /* start from current defaults, then overlay the save — new fields keep their defaults */
  var keys=["cash","unlimitedCash","day","dayT","speed","floors","lobby","breakfast","breakfastMode","priceByType","fees","ledger","today","feed","satis","turnTotal","curFloor","spawnT","gardenNeglect","hallTiles","verticals","landExp","amenitySpots","lobbyGx","lobbyGy","lobbyRot","lobbyW","lobbyH","diningGx","diningGy","diningW","diningH","diningRot","nextRoomId"];
  keys.forEach(function(k){if(s[k]!==undefined)G[k]=s[k];});
  /* Merge dictionaries so a save from an older build can't drop a newer amenity / staff role. */
  Object.keys(AMENITIES).forEach(function(k){G.amenities[k]=(s.amenities&&typeof s.amenities[k]==="number")?s.amenities[k]:0;});
  Object.keys(STAFF_ROLES).forEach(function(k){G.staff[k]=(s.staff&&typeof s.staff[k]==="number")?s.staff[k]:0;});
  G.rooms=Array.isArray(s.rooms)?s.rooms:[];
  /* Guests were serialised with a copy of their archetype — re-link
     each one to the canonical ARCHETYPES entry by key. */
  G.rooms.forEach(function(r){
    if(r&&r.guest&&r.guest.arch&&r.guest.arch.key){
      for(var i=0;i<ARCHETYPES.length;i++)if(ARCHETYPES[i].key===r.guest.arch.key){r.guest.arch=ARCHETYPES[i];break;}
    }
    if(r&&typeof r.nightsLeft!=="number")r.nightsLeft=(r.state==="occupied"&&r.guest)?(r.guest.stay||1):0;
  });
  if(!G.today||typeof G.today!=="object")G.today=newDayRec();
  if(!Array.isArray(G.ledger))G.ledger=[];
  if(!Array.isArray(G.feed))G.feed=[];
  if(!Array.isArray(G.satis))G.satis=[];
  if(!G.hallTiles||typeof G.hallTiles!=="object")G.hallTiles={};
  if(!Array.isArray(G.verticals))G.verticals=[];
  if(!G.amenitySpots||typeof G.amenitySpots!=="object")G.amenitySpots={};
  if(!G.priceByType||typeof G.priceByType!=="object")G.priceByType={standard:45};
  if(!G.fees||typeof G.fees!=="object")G.fees={pool:8,parking:10};
  /* Saves from before the cash toggle have no unlimitedCash field:
     their stored cash may be the old 999,999,999 placeholder — never
     real money. Such a hotel now defaults to limited (finite) cash,
     like a new game, and its real finite balance starts at the
     normal starting cash, tracked exactly from here on. A save that
     does carry an explicit unlimitedCash choice keeps that choice. */
  if(typeof s.unlimitedCash!=="boolean"){
    G.unlimitedCash=false;
    if(typeof G.cash==="number"&&G.cash>=999999999)G.cash=START_CASH;
  }
  G.floors=Math.max(1,Math.min(20,G.floors||1));
  G.curFloor=Math.max(1,Math.min(G.floors,G.curFloor||1));

  G.paused=false; G.started=false; /* stays false until the player taps Continue */
  resumedGame=true; bootSaveFound=true;

}

/* ---------- Derived values ---------- */
function roomAppeal(r){
  var a=ROOM_TYPES[r.type].appeal;
  ["bed","bath","tv","furn","finish"].forEach(function(t){a+=TRACKS[t].levels[r[t]][2];});
  if(r.floor>=4)a+=Math.min(6,r.floor-3);
  if(typeof roomIndoors==="function"&&roomIndoors(r))a+=3; /* reached under cover, not across the lawn */
  if(r.condition<30)a-=6; else if(r.condition<60)a-=3;
  if(r.state==="broken")a-=12;
  return Math.max(0,a);
}
function hotelAppeal(){
  var a=LOBBY_TIERS[G.lobby].appeal+BREAKFAST_TIERS[G.breakfast].appeal;
  /* Containers earn a little appeal for real floor area beyond their starting footprint — a bigger lobby / dining room seats and impresses more guests. */
  if(G.lobbyGx!=null&&typeof lobbyW==='function')a+=Math.max(0,Math.round((lobbyW()*lobbyH()-4)/4));
  if(G.diningGx!=null&&G.breakfast>0)a+=Math.max(0,Math.round(((G.diningW||4)*(G.diningH||3)-12)/3));
  Object.keys(AMENITIES).forEach(function(k){
    var t=G.amenities[k]; if(t>0){var ap=AMENITIES[k].tiers[t][3]; if(k==="garden"&&G.staff.gardener===0)ap=Math.round(ap*(1-G.gardenNeglect*0.5)); a+=ap;}
  });
  if(G.rooms.length){var s=0;G.rooms.forEach(function(r){s+=roomAppeal(r);});a+=Math.round(s/G.rooms.length*0.5);}
  (G.verticals||[]).forEach(function(v){a+=(VERTICAL_TYPES[v.kind]?VERTICAL_TYPES[v.kind].appeal:0);});
  return a;
}
/* Internal only: what guests privately judge a room to be worth. Never
   shown to the player — pricing is learned from who stays and who walks. */
function guestValue(r){return Math.round(22+hotelAppeal()*0.55+roomAppeal(r)*0.90);}
function starRating(){if(!G.satis.length)return null;var s=0;G.satis.forEach(function(x){s+=x;});return s/G.satis.length;}
function era(){
  var ap=hotelAppeal(),n=G.rooms.length;
  var score=0;
  if(ap>=40||n>=4)score=2; if(ap>=180||n>=12)score=Math.max(score,3);
  if(ap>=320||n>=40)score=Math.max(score,4); if(ap>=520||n>=80)score=Math.max(score,5);
  if(ap>=750||n>=150)score=Math.max(score,6);
  return Math.max(1,score|| (ap>0?1:1));
}
function monthlyCosts(){
  /* No rent — you own the property. The month-end pressure is
     upkeep (lobby, breakfast, amenities) and staff wages only. */
  var wages=0;Object.keys(STAFF_ROLES).forEach(function(k){wages+=G.staff[k]*STAFF_ROLES[k].wage;});
  var upkeep=LOBBY_TIERS[G.lobby].upkeep+BREAKFAST_TIERS[G.breakfast].upkeep;
  Object.keys(AMENITIES).forEach(function(k){var t=G.amenities[k];if(t>0)upkeep+=AMENITIES[k].tiers[t][2];});
  return {wages:wages,upkeep:upkeep,total:wages+upkeep};
}
function arrivalsPerDay(){
  var st=starRating()||3;
  return Math.min(G.rooms.length*1.6+2, 2+hotelAppeal()/25+st*2);
}
function hasAmenityForDesire(d){
  switch(d){
    case "pool":return G.amenities.pool>0; case "gym":return G.amenities.gym>0;
    case "spa":return G.amenities.spa>0; case "meeting":return G.amenities.meeting>0;
    case "expo":return G.amenities.expo>0; case "garden":return G.amenities.garden>0;
    case "parking":return G.amenities.parking>0; case "fountain":return G.amenities.fountain>0;
    case "chef":return G.breakfast>=5; case "breakfast":return G.breakfast>0;
    case "wifi":return true; case "bigtv":return G.rooms.some(function(r){return r.tv>=3;});
    case "bath":return G.rooms.some(function(r){return r.bath>=4;});
    case "desk":return G.rooms.some(function(r){return r.furn>=2;});
  } return false;
}
function topTierDesire(d){
  if(d==="pool")return G.amenities.pool>=4; if(d==="chef")return true;
  if(d==="bigtv")return G.rooms.some(function(r){return r.tv>=4;});
  if(d==="bath")return G.rooms.some(function(r){return r.bath>=5;});
  if(d==="spa")return G.amenities.spa>=3; return false;
}
function priceFor(r){return G.priceByType[r.type]||ROOM_TYPES[r.type].defPrice;}
function readyRooms(){return G.rooms.filter(function(r){return r.state==="ready";});}
function jobsCount(){return G.rooms.filter(function(r){return r.state==="dirty"||r.state==="broken"||r.deepDue;}).length;}
/* ---------- Audio (tiny synth, resumed on first tap) ---------- */
var AC=null;
function beep(f,d,type,g){if(!AC)return;try{var o=AC.createOscillator(),v=AC.createGain();o.type=type||"square";o.frequency.value=f;v.gain.value=g||0.04;o.connect(v);v.connect(AC.destination);o.start();v.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+(d||0.09));o.stop(AC.currentTime+(d||0.09));}catch(e){}}
function sfx(kind){if(kind==="coin"){beep(880,.08);setTimeout(function(){beep(1320,.1);},70);}else if(kind==="pop"){beep(220,.09,"triangle",.05);}else if(kind==="scrub"){beep(520,.05,"sawtooth",.02);}else if(kind==="chime"){beep(660,.12,"sine",.05);}}

/* ---------- Feed / toast ---------- */
function feed(html){G.feed.unshift({day:G.day,html:html});if(G.feed.length>60)G.feed.pop();if(G.tab==="feed")renderPanel();}
var toastT=null;
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(function(){t.style.display="none";},3400);}

/* ---------- Guests ---------- */
var people=[]; /* visual entities, managed by the 3D section */
function rnd(a,b){return a+Math.random()*(b-a);}
function ri(a,b){return Math.floor(rnd(a,b+1));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function makeGuest(){
  var ap=hotelAppeal();
  var pool=ARCHETYPES.filter(function(a){return a.era<=era()+ (ap> (a.min[0]) ?1:0) && (a.key==="backpacker"||ap>=a.min[0]*0.6);});
  if(!pool.length)pool=[ARCHETYPES[0]];
  /* weight: richer archetypes appear more as appeal grows */
  var bag=[];pool.forEach(function(a){var w=1+Math.max(0,(ap-a.min[0]))/160;for(var i=0;i<Math.max(1,Math.round(w*3));i++)bag.push(a);});
  var arch=pick(bag);
  var g={arch:arch,budget:Math.round(rnd(arch.budget[0],arch.budget[1])),
    min:ri(arch.min[0],arch.min[1]),desire:pick(arch.desires),
    party:ri(arch.party[0],arch.party[1]),stay:ri(arch.stay[0],arch.stay[1]),
    id:Math.random().toString(36).slice(2,8)};
  return g;
}
/* The door decision, in the design doc's order. Returns {ok, room, reason} */
function doorDecision(g){
  var allReady=readyRooms();
  /* A room nobody can REACH does not count: it must have a hallway
     path from the lobby to its door (see the ground-grid rules). */
  var ready=allReady.filter(function(r){return roomReachable(r);});
  if(!ready.length){
    if(allReady.length)return {ok:false,reason:"noPath",text:"No way to reach a room from the lobby."};
    return {ok:false,reason:"noRoom",text:"No room for me."};
  }
  var fitting=ready.filter(function(r){return ROOM_TYPES[r.type].sleeps>=g.party;});
  if(!fitting.length)return {ok:false,reason:"party",text:"Nothing fits my party of "+g.party+"."};
  var desireHas=hasAmenityForDesire(g.desire), top=topTierDesire(g.desire);
  var budget=g.budget*(desireHas?(top?1.25:1.15):1);
  var minNeeded=g.min-(desireHas?15:0)-(G.staff.receptionist>0?8:0);
  /* choose the cheapest acceptable room that fits, preferring lower price */
  fitting.sort(function(a,b){return priceFor(a)-priceFor(b);});
  var best=null, sawStandardFail=false, sawPriceFail=false;
  for(var i=0;i<fitting.length;i++){
    var r=fitting[i], total=hotelAppeal()+roomAppeal(r);
    if(total<minNeeded){sawStandardFail=true;continue;}
    if(priceFor(r)>budget){sawPriceFail=true;continue;}
    best=r;break;
  }
  if(best)return {ok:true,room:best,desireHas:desireHas};
  if(sawPriceFail&&!sawStandardFail)return {ok:false,reason:"price",text:"Too much for this place."};
  if(sawStandardFail)return {ok:false,reason:"standard",text:"Not quite my standard."};
  return {ok:false,reason:"price",text:"Too much for this place."};
}
function guestArrives(){
  var g=makeGuest();
  spawnPerson(g); /* 3D: walks to the desk, decision resolves when they arrive */
}
function resolveGuest(g){
  var d=doorDecision(g);
  var who="<b>"+g.arch.name+"</b> (budget $"+g.budget+"/night, wants "+(DESIRE_LABEL[g.desire]||g.desire)+")";
  if(!d.ok){
    if(d.reason==="noRoom")G.today.turnNoRoom++;
    else if(d.reason==="noPath")G.today.turnNoPath++;
    else if(d.reason==="standard")G.today.turnStandard++;
    else if(d.reason==="party")G.today.turnParty++;
    else G.today.turnPrice++;
    feed(who+" turned away — <span class='why'>“"+d.text+"”</span>");
    sfx("pop");
    refreshOpenMenus();
    return d;
  }
  var r=d.room;
  r.state="occupied"; r.guest=g; r.nightsLeft=g.stay; r.stays++;
  G.today.checkedIn++;
  feed(who+" checked into <b>"+ROOM_TYPES[r.type].name+"</b> (Floor "+r.floor+") for "+g.stay+" night"+(g.stay>1?"s":"")+" at $"+priceFor(r)+"/night."+(d.desireHas?" Their want — "+(DESIRE_LABEL[g.desire])+" — is here, so they stretched their budget.":""));
  sfx("coin");
  refreshOpenMenus(); /* a ready room just became occupied — refresh any open menu showing it */
  return d;
}
/* Morning checkout for one room */
function checkoutRoom(r){
  var g=r.guest; if(!g)return;
  /* satisfaction */
  var s=3;
  if(hasAmenityForDesire(g.desire))s+=1;
  if(r.condition>=85)s+=1;
  if(priceFor(r)>guestValue(r)*1.2)s-=1;
  if(r.condition<40)s-=1;
  if(g.arch.key==="affluent"||g.arch.key==="vip"){if(G.staff.concierge>0)s+=1;}
  s=Math.max(1,Math.min(5,s));
  G.satis.push(s); if(G.satis.length>50)G.satis.shift();
  /* wear + faults */
  /* wear per stay is HALF what it used to be — rooms need refurbishing half as often */
  r.condition=Math.max(0,r.condition-Math.max(1,Math.round((ri(2,5)+(g.party>=3?2:0))/2)));
  r.guest=null; r.nightsLeft=0;
  var roll=Math.random();
  var breakMult=r.condition<60?2:1;
  if(roll<0.03*breakMult){r.state="broken";r.repairKind="major";feed("Room on Floor "+r.floor+" ("+ROOM_TYPES[r.type].name+") suffered a <b>major fault</b> — plumbing/AC. Out of service until repaired.");}
  else if(roll<0.09*breakMult){r.state="broken";r.repairKind="minor";feed("Room on Floor "+r.floor+" ("+ROOM_TYPES[r.type].name+") needs a <b>minor repair</b> (tap, bulb or remote).");}
  else{r.state="dirty";}
  if(r.stays%10===0){r.deepDue=true;}
  feed(g.arch.name+" checked out of Floor "+r.floor+" — "+s+"★ stay. Room needs "+(r.state==="broken"?"repair":"cleaning")+".");
  refreshOpenMenus(); /* the room's state just flipped occupied → dirty/broken: if its menu (or the Rooms list) is open, the Clean / Repair option must appear NOW, not on close-and-reopen */
}

/* ---------- Day cycle ---------- */
var DAY_SECONDS=20; /* base pace: a full day in 20s — clock runs 50% faster than the previous 30s day (days felt too slow). Arrivals per day are unchanged: spawnT is derived from DAY_SECONDS, so guests simply arrive closer together in real time. */
function endOfDay(){
  /* nightly income from occupied rooms */
  var occ=0, supplyCost=0;
  G.rooms.forEach(function(r){
    if(r.state==="occupied"){
      occ++;
      var p=priceFor(r); G.today.roomInc+=p; G.today.nights++;
      /* fees: breakfast + amenity use */
      var bt=BREAKFAST_TIERS[G.breakfast];
      if(G.breakfast>0){
        supplyCost+=bt.perGuest; G.today.costs+=bt.perGuest; /* ledger-only; cash leaves below, once */
        if(G.breakfastMode==="fee"){G.today.feeInc+=bt.fee;}
      }
      if(r.guest.desire==="pool"&&G.amenities.pool>0)G.today.feeInc+=G.fees.pool;
      if(r.guest.desire==="spa"&&G.amenities.spa>0)G.today.feeInc+=AMENITIES.spa.fee;
      if(r.guest.desire==="parking"&&G.amenities.parking>0)G.today.feeInc+=G.fees.parking;
      if(G.amenities.dining>0&&Math.random()<0.5)G.today.feeInc+=AMENITIES.dining.fee;
      if(r.guest.desire==="meeting"&&G.amenities.meeting>0)G.today.feeInc+=40;
      r.nightsLeft--;
    }
  });
  G.today.occRooms=occ;
  /* expo / meeting hire with an event manager */
  if(G.staff.eventmgr>0){
    if(G.amenities.expo>0&&Math.random()<0.55){var h=AMENITIES.expo.hire*G.amenities.expo;G.today.eventInc+=h;feed("Event Manager booked the hall — <b>$"+h+"</b> hire income.");}
    else if(G.amenities.meeting>0&&Math.random()<0.5){G.today.eventInc+=AMENITIES.meeting.hire;}
  }
  /* While unlimited cash is on, the real balance is untouched:
     the night's income is recorded in the ledger but not banked. */
  if(!unlimitedCash())G.cash+=G.today.roomInc+G.today.feeInc+G.today.eventInc-supplyCost;
  /* checkouts happen in the morning */
  G.rooms.forEach(function(r){if(r.state==="occupied"&&r.nightsLeft<=0)checkoutRoom(r);});
  /* monthly charges on day 30, 60, ... */
  if(G.day%30===0){
    var mc=monthlyCosts();
    if(!unlimitedCash())G.cash-=mc.total;
    G.today.costs+=mc.total;
    feed("<b>Month end (Day "+G.day+"):</b> wages $"+mc.wages+" · upkeep $"+mc.upkeep+" = <b>$"+mc.total+"</b>"+(unlimitedCash()?" (unlimited cash — real balance untouched).":" paid."));
    if(!unlimitedCash()&&G.cash<0)toast("Cash is negative — upkeep and wages are eating you alive. Raise occupancy or cut costs.");
  }
  if(G.staff.gardener===0&&G.amenities.garden>0)G.gardenNeglect=Math.min(1,G.gardenNeglect+0.04);else G.gardenNeglect=Math.max(0,G.gardenNeglect-0.1);
  G.ledger.push(G.today); if(G.ledger.length>60)G.ledger.shift();
  G.day++; G.today=newDayRec();
  rebuildScene(); updateHUD();
  if(G.tab==="ledger"||G.tab==="rooms")renderPanel();
}
function trailing30(){
  var days=G.ledger.slice(-29).concat([G.today]);
  var t={roomInc:0,feeInc:0,eventInc:0,costs:0,nights:0,turnNoRoom:0,turnStandard:0,turnPrice:0,turnParty:0,turnNoPath:0,checkedIn:0,occSum:0,ndays:days.length};
  days.forEach(function(d){t.roomInc+=d.roomInc;t.feeInc+=d.feeInc;t.eventInc+=d.eventInc;t.costs+=d.costs;t.nights+=d.nights;
    t.turnNoRoom+=d.turnNoRoom;t.turnStandard+=d.turnStandard;t.turnPrice+=d.turnPrice;t.turnParty+=d.turnParty;t.turnNoPath+=(d.turnNoPath||0);t.checkedIn+=d.checkedIn;t.occSum+=d.occRooms;});
  t.profit=t.roomInc+t.feeInc+t.eventInc-t.costs;
  t.occupancy=G.rooms.length? (t.occSum/Math.max(1,t.ndays))/G.rooms.length : 0;
  t.adr=t.nights? t.roomInc/t.nights:0;
  t.revpar=t.adr*t.occupancy;
  return t;
}

/* ---------- Player / staff actions ---------- */
function spend(cost){if(unlimitedCash())return true;if(G.cash<cost){toast("Not enough cash — need $"+cost.toLocaleString()+", have $"+Math.floor(G.cash).toLocaleString()+".");return false;}G.cash-=cost;return true;}
function cleanRoom(r,byStaff){
  if(r.state!=="dirty"&&!r.deepDue)return;
  if(!byStaff){if(!unlimitedCash()){G.cash-=3;G.today.costs+=3;}sfx("scrub");}
  r.state="ready"; if(r.deepDue){r.deepDue=false;if(!byStaff&&!unlimitedCash()){G.cash-=6;G.today.costs+=6;}}
  feed("Room on Floor "+r.floor+" cleaned"+(byStaff?" by staff":" by you")+" — Ready.");
  rebuildScene(); updateHUD(); if(G.tab==="rooms")renderPanel(); refreshSelInfo();
}
function repairRoom(r,byStaff){
  if(r.state!=="broken")return;
  var cost=r.repairKind==="major"?ri(90,450):ri(12,40);
  if(!byStaff){if(!spend(cost))return; if(!unlimitedCash())G.today.costs+=cost;}
  else {if(!unlimitedCash()){G.cash-=cost;G.today.costs+=cost;}}
  r.state="dirty"; r.repairKind=null; /* repaired, still needs a clean */
  feed("Room on Floor "+r.floor+" repaired ($"+cost+") — now needs cleaning.");
  rebuildScene(); updateHUD(); if(G.tab==="rooms")renderPanel(); refreshSelInfo();
}
/* Refurbish costs HALF what it used to (was 200 + appeal×18). One
   helper so the charge and every price shown for it can never drift. */
function refurbCost(r){return Math.round((200+ROOM_TYPES[r.type].appeal*18)/2);}
function refurbishRoom(r){
  var cost=refurbCost(r);
  if(!spend(cost))return;
  r.condition=100; feed("Room on Floor "+r.floor+" refurbished — condition 100%.");
  rebuildScene(); if(G.tab==="rooms")renderPanel(); refreshSelInfo();
}
/* Demolish a room: its footprint goes back to empty plot and can
   be built on again. You get NO money back — $0, always. Two taps:
   the first arms the button, the second (within 8s) confirms, so a
   stray tap on a phone can't wipe a room. An occupied room can't be
   demolished under its guest — wait for checkout. */
var demolishArmId=null,demolishArmAt=0;
function demolishRoom(r){
  if(!r)return;
  if(r.state==="occupied"){toast("Can't demolish — a guest is staying in that room. Wait for checkout.");return;}
  if(demolishArmId!==r.id||Date.now()-demolishArmAt>8000){
    demolishArmId=r.id; demolishArmAt=Date.now();
    toast("Demolish this "+ROOM_TYPES[r.type].name+"? Tap Demolish again to confirm — you get $0 back.");
    if(G.tab==="rooms")renderPanel();
    refreshSelInfo();
    return;
  }
  demolishArmId=null; demolishArmAt=0;
  var label="Floor "+r.floor+" · "+ROOM_TYPES[r.type].name;
  G.rooms=G.rooms.filter(function(x){return x.id!==r.id;});
  if(G.selectedRoomId===r.id){G.selectedRoomId=null;G.selected=null;var si=document.getElementById("selInfo");if(si)si.style.display="none";}
  feed("Demolished <b>"+label+"</b> — $0 back. The plot is clear to build on again.");
  toast("Demolished — $0 back.");
  sfx("pop");
  rebuildScene(); updateHUD();
  if(G.tab==="rooms")renderPanel();
}
function staffWork(){
  /* Handymen still repair on this pass. Housekeepers NO longer clean
     from here: each cleaner now WALKS the real hallway path to a
     dirty room, spends two seconds cleaning it, and only then is
     the room ready — see the cleaner agents below (tickCleaners). */
  var hm=G.staff.handyman+(G.staff.manager>0?1:0);
  var broken=G.rooms.filter(function(r){return r.state==="broken";});
  for(var j=0;j<Math.min(hm,broken.length);j++)repairRoom(broken[j],true);
}
/* ---------- Cleaners: housekeepers path to each dirty room ----------
   One agent per housekeeper (a manager covers one extra, as before).
   An idle agent picks the reachable dirty room with the shortest
   route, walks it tile by tile over the same walkable network the
   guests use (hallways + lobby + dining + shafts, riding a shaft
   between floors), steps inside, and cleans for CLEAN_SECONDS —
   the room stays dirty until those two seconds are up. Then the
   agent picks the next dirty room, or walks back to the lobby.
   Agent positions live in tile space, independent of the DOM, so
   cleaning keeps working on floors you aren't looking at; the
   staff figure on screen is bound to its agent in buildStaff. */
var CLEAN_SECONDS=2, CLEANER_SPEED=1.8; /* tiles per second — halved (was 3.6): characters move at half speed while the clock runs faster. CLEAN_SECONDS stays 2 real seconds of cleaning, as before. */
var cleaners=[];
function cleanerCount(){return G.staff.housekeeper+(G.staff.manager>0?1:0);}
function cleanerWalkable(f,x,y){
  if(!inGrid(x,y))return false;
  if(hasHall(f,x,y)||verticalAt(x,y))return true;
  if(f===1&&(isLobbyTile(x,y)||isDiningTile(x,y)))return true;
  return false;
}
function bfsCleanerPath(f,sx,sy,isTarget){
  if(!cleanerWalkable(f,sx,sy))return null;
  var prev={},queue=[[sx,sy]],found=null;
  prev[sx+","+sy]="start";
  if(isTarget(sx,sy))found=sx+","+sy;
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(queue.length&&!found){
    var cur=queue.shift();
    for(var i=0;i<4;i++){
      var nx=cur[0]+dirs[i][0],ny=cur[1]+dirs[i][1],k=nx+","+ny;
      if(prev[k]||!cleanerWalkable(f,nx,ny))continue;
      prev[k]=cur[0]+","+cur[1];queue.push([nx,ny]);
      if(isTarget(nx,ny)){found=k;break;}
    }
  }
  if(!found)return null;
  var path=[],k2=found;
  while(k2&&k2!=="start"){var p=k2.split(",");path.unshift([+p[0],+p[1]]);k2=prev[k2];}
  return path;
}
function nearestCleanerTile(f,gx,gy){
  var cx=Math.floor(gx),cy=Math.floor(gy);
  if(cleanerWalkable(f,cx,cy))return [cx,cy];
  for(var rad=1;rad<=10;rad++){
    for(var y=cy-rad;y<=cy+rad;y++)for(var x=cx-rad;x<=cx+rad;x++){
      if(Math.max(Math.abs(x-cx),Math.abs(y-cy))!==rad)continue;
      if(cleanerWalkable(f,x,y))return [x,y];
    }
  }
  return null;
}
/* One leg on one floor: from (gx,gy) to the point (tx,ty), walking
   tile centres, then the exact target point, then any final points
   (e.g. the spot inside the room where the occupant stands). */
function cleanerLeg(f,gx,gy,tx,ty,finalPts){
  var start=nearestCleanerTile(f,gx,gy),tt=nearestCleanerTile(f,tx,ty);
  if(!start||!tt)return null;
  var tiles=bfsCleanerPath(f,start[0],start[1],function(x,y){return x===tt[0]&&y===tt[1];});
  if(!tiles)return null;
  var pts=[[gx,gy]];
  tiles.forEach(function(t){pts.push([t[0]+0.5,t[1]+0.5]);});
  pts.push([tx,ty]);
  if(finalPts)finalPts.forEach(function(p){pts.push([p[0],p[1]]);});
  return pts;
}
function cleanerShaftLeg(f,gx,gy){
  var start=nearestCleanerTile(f,gx,gy);
  if(!start)return null;
  var tiles=bfsCleanerPath(f,start[0],start[1],function(x,y){return !!verticalAt(x,y);});
  if(!tiles)return null;
  var pts=[[gx,gy]];
  tiles.forEach(function(t){pts.push([t[0]+0.5,t[1]+0.5]);});
  return pts;
}
/* A full route is a list of steps: {f,pts} walks on one floor, or
   {ride:floor} at a shaft — the shaft occupies the same tiles on
   every floor, so riding just changes the agent's floor there. */
function cleanerRoute(c,tf,tx,ty,finalPts){
  var steps=[],cf=c.floor,cgx=c.gx,cgy=c.gy;
  function shaft(){
    var pts=cleanerShaftLeg(cf,cgx,cgy);
    if(!pts)return false;
    steps.push({f:cf,pts:pts});
    var l=pts[pts.length-1];cgx=l[0];cgy=l[1];
    return true;
  }
  if(cf!==tf){
    if(cf!==1){if(!shaft())return null;steps.push({ride:1});cf=1;}
    if(tf!==1){if(!shaft())return null;steps.push({ride:tf});cf=tf;}
  }
  var pts=cleanerLeg(cf,cgx,cgy,tx,ty,finalPts);
  if(!pts)return null;
  steps.push({f:cf,pts:pts});
  return steps;
}
function cleanerRouteToRoom(c,r){
  var df=doorFront(r);
  return cleanerRoute(c,r.floor,df[0]+0.5,df[1]+0.5,[roomStandPt(r)]);
}
function cleanerHome(){
  if(G.lobby>0&&G.lobbyGx!=null){var lc=lobbyCenter();return [1,lc[0],lc[1]];}
  var r0=G.rooms[0];
  if(r0){var df=doorFront(r0);return [r0.floor,df[0]+0.5,df[1]+0.5];}
  return [1,8,8];
}
function syncCleaners(){
  var n=cleanerCount();
  while(cleaners.length<n){
    var home=cleanerHome();
    cleaners.push({idx:cleaners.length,floor:home[0],gx:home[1],gy:home[2],state:"idle",targetId:null,route:null,si:0,wi:0,cleanT:0,goingHome:false,face:1,fig:null,ph:Math.random()*6});
  }
  if(cleaners.length>n)cleaners.length=n;
}
function cleanerPickJob(c){
  var taken={};
  cleaners.forEach(function(o){if(o!==c&&o.targetId)taken[o.targetId]=true;});
  var best=null,bestRoute=null,bestLen=1e9;
  G.rooms.forEach(function(r){
    if(r.state==="occupied"||r.state==="broken")return;
    if(r.state!=="dirty"&&!r.deepDue)return;
    if(taken[r.id])return;
    var route=cleanerRouteToRoom(c,r);
    if(!route&&r.floor===c.floor){
      /* No hallway route (a motel-style layout with no lobby/hallways
         yet): walk straight across the grass to the door, exactly as
         guests do in that layout, rather than never cleaning. */
      var df2=doorFront(r);
      route=[{f:c.floor,pts:[[c.gx,c.gy],[df2[0]+0.5,df2[1]+0.5],roomStandPt(r)]}];
    }
    if(!route)return; /* unreachable on another floor — no shaft path, a cleaner can't get in either */
    var len=0;route.forEach(function(s){if(s.pts)len+=s.pts.length;});
    if(len<bestLen){best=r;bestRoute=route;bestLen=len;}
  });
  if(best){
    c.targetId=best.id;c.route=bestRoute;c.si=0;c.wi=0;c.state="walk";c.goingHome=false;
  }
}
function cleanerArrive(c){
  c.route=null;
  if(c.targetId){
    var r=byId(c.targetId);
    if(r&&r.state!=="occupied"&&(r.state==="dirty"||r.deepDue)){
      c.state="clean";c.cleanT=CLEAN_SECONDS; /* two seconds of cleaning before the room is ready */
      return;
    }
    c.targetId=null;
  }
  c.state="idle";c.goingHome=false;
}
function cleanerAdvance(c,dt){
  var stepLeft=dt*CLEANER_SPEED,guard=0;
  while(stepLeft>0&&guard++<32){
    var seg=c.route[c.si];
    if(!seg){cleanerArrive(c);return;}
    if(seg.ride){c.floor=seg.ride;c.si++;c.wi=0;continue;}
    var tgt=seg.pts[c.wi];
    if(!tgt){c.si++;c.wi=0;continue;}
    var dx=tgt[0]-c.gx,dy=tgt[1]-c.gy,dist=Math.hypot(dx,dy);
    if(dist<0.05){c.wi++;continue;}
    if(dx<-0.01)c.face=-1;else if(dx>0.01)c.face=1;
    c.dir=dirFromTileVec(dx,dy); /* painted sprite faces its travel direction */
    var mv=Math.min(dist,stepLeft);
    c.gx+=dx/dist*mv;c.gy+=dy/dist*mv;stepLeft-=mv;
    if(mv>=dist)c.wi++;
  }
  if(c.route&&c.si>=c.route.length)cleanerArrive(c);
}
function positionCleanerFig(c){
  var st=c.fig;
  if(!st||!st.el)return;
  var pp=projPct(c.gx,c.gy);
  st.el.style.left=pp[0]+"%";st.el.style.top=pp[1]+"%";
  st.el.style.zIndex=personZ(pp[1]); /* depth follows the agent as it walks, like the patrols */
  var bob=(c.state==="walk"||c.state==="clean")?Math.abs(Math.sin(c.ph))*-PW*0.05:0;
  st.el.style.marginTop=(-PW*1.30+bob)+"px";
  if(st.charKey&&setCharFig(st.el,st.charKey,(c.dir!=null?c.dir:DIR_SE),(Math.sin(c.ph)>=0?0:1),c.state==="walk"))st.el.style.transform="";
  else st.el.style.transform=c.face<0?"scaleX(-1)":"";
  if(c.state==="clean"){
    if(!st.bubble){var b=document.createElement("span");b.className="bubble";b.textContent="Cleaning…";st.el.appendChild(b);st.bubble=b;}
  }else if(st.bubble&&st.bubble.parentNode){st.bubble.parentNode.removeChild(st.bubble);st.bubble=null;}
}
function tickCleaners(dt){
  if(!G||!G.started||dt<=0)return;
  syncCleaners();
  cleaners.forEach(function(c){
    c.ph+=dt*4.5; /* walk-cycle cadence halved with travel speed, so the bob/frames stay in step with the feet */
    if(c.state==="clean"){
      var r=byId(c.targetId);
      if(!r||r.state==="occupied"||(r.state!=="dirty"&&!r.deepDue)){c.state="idle";c.targetId=null;}
      else{
        c.cleanT-=dt;
        if(c.cleanT<=0){c.state="idle";c.targetId=null;cleanRoom(r,true);}
      }
    }else if(c.state==="walk"&&c.route){
      if(c.targetId){
        var rt=byId(c.targetId);
        if(!rt||rt.state==="occupied"||(rt.state!=="dirty"&&!rt.deepDue)){c.targetId=null;c.route=null;c.state="idle";c.goingHome=false;}
      }
      if(c.state==="walk"&&c.route)cleanerAdvance(c,dt);
    }else{
      c.state="idle";c.targetId=null;c.route=null;
      cleanerPickJob(c);
      if(c.state==="idle"&&!c.goingHome){
        var home=cleanerHome();
        if(c.floor!==home[0]||Math.hypot(c.gx-home[1],c.gy-home[2])>1.2){
          var rtHome=cleanerRoute(c,home[0],home[1],home[2],null);
          if(rtHome){c.route=rtHome;c.si=0;c.wi=0;c.state="walk";c.goingHome=true;}
        }
      }
    }
    positionCleanerFig(c);
  });
}

/* Can an amenity grow to a new footprint anchored at its current
   spot? Its own current tiles are fine; hallway tiles under the
   growth edge get paved over; rooms, shafts and other amenities
   block it. The lobby / dining floor blocks it too — UNLESS the
   amenity is a fountain that already lives inside that container,
   in which case the container floor is its home (see homeL/homeD). */
function amenityGrowFits(key,gx,gy,w,h,floor){
  var spot=(G.amenitySpots||{})[key]; if(!spot)return false;
  /* A fountain that already LIVES inside the lobby / dining container
     may grow there: that container's floor is its home, not an
     obstacle — even when the bigger footprint reaches past the
     container's far edge onto otherwise-clear ground. A fountain
     living OUTSIDE a container still cannot grow into one. */
  var homeL=false, homeD=false;
  if(key==="fountain"&&spot.floor===1){
    if(G.lobbyGx!=null)homeL=spot.gx>=G.lobbyGx&&spot.gy>=G.lobbyGy&&spot.gx+spot.w<=G.lobbyGx+lobbyW()&&spot.gy+spot.h<=G.lobbyGy+lobbyH();
    if(G.diningGx!=null)homeD=spot.gx>=G.diningGx&&spot.gy>=G.diningGy&&spot.gx+spot.w<=G.diningGx+diningW()&&spot.gy+spot.h<=G.diningGy+diningH();
  }
  for(var y=gy;y<gy+h;y++)for(var x=gx;x<gx+w;x++){
    if(!inGrid(x,y))return false;
    if(floor===spot.floor&&x>=spot.gx&&x<spot.gx+spot.w&&y>=spot.gy&&y<spot.gy+spot.h)continue;
    if(roomAtCellF(floor,x,y))return false;
    if(floor===1&&isLobbyTile(x,y)&&!homeL&&!(key==='fountain'&&amenityInsideContainer(key,gx,gy,w,h)))return false;
    if(floor===1&&isDiningTile(x,y)&&!homeD&&!(key==='fountain'&&amenityInsideContainer(key,gx,gy,w,h)))return false;
    if(verticalAt(x,y))return false;
    var other=amenityAtCellF(floor,x,y); if(other&&other!==key)return false;
  }
  return true;
}
/* Place a newly bought amenity on the grid (called by the placement
   flow, after the ghost was validated). This is what the Fountain
   was missing: buying it used to just bump a number and draw
   nothing anywhere a player could see. */
function placeAmenity(key,gx,gy,floor){
  var a=AMENITIES[key], cur=G.amenities[key], n=a.tiers[cur+1]; if(!n)return false;
  var sz=amenitySize(key,cur+1);
  if(!footprintFreeF(floor,gx,gy,sz[0],sz[1])&&!amenityInsideContainer(key,gx,gy,sz[0],sz[1]))return false;
  if(!spend(n[1]))return false;
  G.amenities[key]++;
  if(!G.amenitySpots)G.amenitySpots={};
  G.amenitySpots[key]={gx:gx,gy:gy,floor:floor,w:sz[0],h:sz[1]};
  feed("Built the <b>"+a.name+"</b> — "+n[0]+" — on Floor "+floor+" at "+gx+","+gy+" ("+sz[0]+"×"+sz[1]+" tiles, +"+n[3]+" Appeal, $"+n[2]+"/mo upkeep). It is drawn where it stands.");
  toast(a.name+" placed — "+n[0]); sfx("pop");
  rebuildScene(); updateHUD(); return true;
}
function buyAmenity(key){
  var a=AMENITIES[key], cur=G.amenities[key], n=a.tiers[cur+1]; if(!n)return;
  if(!G.amenitySpots)G.amenitySpots={};
  var spot=G.amenitySpots[key];
  if(!spot){
    /* First tier is PLACED, not just bought: pick its spot on the
       floor you are viewing, preview the footprint, hold to place. */
    var sz=amenitySize(key,cur+1);
    startPlacement({kind:"amenity",key:key,label:a.name+" — "+n[0],cost:n[1],w:sz[0],h:sz[1]});
    return;
  }
  /* Later tiers upgrade the same facility in place, growing its
     footprint to the next tier's size when that tier is bigger. */
  var ns=amenitySize(key,cur+1);
  if((ns[0]!==spot.w||ns[1]!==spot.h)&&!amenityGrowFits(key,spot.gx,spot.gy,ns[0],ns[1],spot.floor)){
    toast(n[0]+" needs a clear "+ns[0]+"×"+ns[1]+" area around the "+a.name+" — a room, shaft or another amenity is in the way.");
    return;
  }
  if(!spend(n[1]))return;
  if(ns[0]!==spot.w||ns[1]!==spot.h){
    for(var y=spot.gy;y<spot.gy+ns[1];y++)for(var x=spot.gx;x<spot.gx+ns[0];x++)delete G.hallTiles[hallKey(spot.floor,x,y)];
    spot.w=ns[0]; spot.h=ns[1];
  }
  G.amenities[key]++;
  feed("<b>"+a.name+"</b> upgraded in place to "+n[0]+" (+ "+n[3]+" Appeal, $"+n[2]+"/mo upkeep) — now "+spot.w+"×"+spot.h+" tiles on Floor "+spot.floor+".");
  toast(a.name+": "+n[0]); rebuildScene(); updateHUD(); renderPanel();
}

function byId(id){return G.rooms.filter(function(r){return r.id===id;})[0]||null;}
/* ---------- Fine placement grid (tiles smaller than a room) ----------
   Rooms are sized by tier (3x3 for a Single up to 11x9 for a
   Penthouse — each tier two tiles larger than the one below,
   alternating width and height). At the start guests cross the lawn
   and knock at the room door, and there is NO lobby and NO corridor.
   Paving tiles with hallway floor ($30) is done from the Build tab.
   A room whose doorstep is on a paved tile counts as INDOORS
   (+3 appeal, guests reach it under cover). */
var HALL_COST=30;
/* ================= THE GROUND GRID =================
   The ENTIRE ground is one grid: GRID_W x GRID_H single tiles. Rooms
   (sized by tier, 3x3 to 11x9), hallways (placed as 2x2 areas) and the lobby (2x2 at
   tier 1) can be placed ANYWHERE on it. Every room has a door that
   can face any of the 4 directions — rot: 0 North, 1 East, 2 South,
   3 West — set with the Rotate button (or R) while placing.
   REACHABILITY RULE: connections are judged by TOUCH. Once a lobby
   exists, any hallway path that touches the lobby is connected to
   it, and a room can be used when that network reaches the tile in
   front of its door or a tile right beside that doorstep. Any path
   that touches a stairwell or elevator shaft links its whole floor
   to the others through the shaft. No touching path = nobody can
   get to the room, and guests will turn away. Before any lobby is
   built the hotel is a motel: guests cross the grass straight to
   the door. */
/* There is NO buying property any more: the plot is simply huge
   from the start — far bigger than the old fully-expanded 60×34
   plot — on every floor, so a large multistory complex of buildings
   fits on it. Nothing about land is bought, sold or unlocked. */
var GRID_W=80,GRID_H=48;
function syncGridSize(){GRID_W=80;GRID_H=48;}
function expandLand(){toast("No land to buy — the plot is already "+GRID_W+"×"+GRID_H+" on every floor.");}
var ROT_NAMES=["North ↑","East →","South ↓","West ←"];
function hallKey(f,gx,gy){return f+","+gx+","+gy;}
function hasHall(f,gx,gy){if(!G.hallTiles)G.hallTiles={};return !!G.hallTiles[hallKey(f,gx,gy)];}
function hallFrontCount(slot,floor){ /* legacy helper for upper floors */
  var n=0;for(var dx=0;dx<4;dx++)for(var dy=0;dy<2;dy++)if(hasHall(floor,slot*4+dx,4+dy))n++;
  return n;
}
function roomIndoors(r){
  var df=doorFront(r);
  return hasHall(r.floor,df[0],df[1])||!!verticalAt(df[0],df[1]);
}
/* The tile directly in front of a room's door, for its rotation. The
   door sits off-centre so rotating it walks it around the room. The
   offsets scale with the room's own width/height (tiers differ). */
function doorFront(r){
  return doorFrontAt(r.gx,r.gy,r.rot||0,roomW(r),roomH(r));
}
function doorFrontAt(gx,gy,rot,w,h){
  w=w||4; h=h||4;
  if(rot===0)return [gx+Math.floor((w-1)/2),gy-1];
  if(rot===1)return [gx+w,gy+Math.floor((h-1)/2)];
  if(rot===2)return [gx+Math.floor(w/2),gy+h];
  return [gx-1,gy+Math.floor(h/2)];
}
function inGrid(gx,gy){return gx>=0&&gy>=0&&gx<GRID_W&&gy<GRID_H;}
function isLobbyTile(gx,gy){
  if(G.lobby===0||G.lobbyGx==null)return false;
  return gx>=G.lobbyGx&&gx<G.lobbyGx+lobbyW()&&gy>=G.lobbyGy&&gy<G.lobbyGy+lobbyH();
}
function roomAtCell(gx,gy){return roomAtCellF(1,gx,gy);}
function roomAtCellF(floor,gx,gy){
  for(var i=0;i<G.rooms.length;i++){var r=G.rooms[i];if(r.floor!==floor)continue;
    if(gx>=r.gx&&gx<r.gx+roomW(r)&&gy>=r.gy&&gy<r.gy+roomH(r))return r;}
  return null;
}
/* Stairwells & elevators occupy the same tiles on EVERY floor. */
function verticalAt(gx,gy){
  var vs=G.verticals||[];
  for(var i=0;i<vs.length;i++){var v=vs[i];
    if(gx>=v.gx&&gx<v.gx+v.w&&gy>=v.gy&&gy<v.gy+v.h)return v;}
  return null;
}
/* Which amenity (if any) covers this cell on this floor? Amenities
   occupy real grid tiles, exactly like rooms and shafts. */
function amenityAtCellF(floor,gx,gy){
  var spots=G.amenitySpots||{};
  for(var k in spots){var sp=spots[k]; if(!sp||sp.floor!==floor)continue;
    if(gx>=sp.gx&&gx<sp.gx+sp.w&&gy>=sp.gy&&gy<sp.gy+sp.h)return k;}
  return null;
}
function cellFree(gx,gy){return cellFreeF(1,gx,gy);}
function cellFreeF(floor,gx,gy){
  return inGrid(gx,gy)&&!roomAtCellF(floor,gx,gy)&&!(floor===1&&isLobbyTile(gx,gy))&&!(floor===1&&isDiningTile(gx,gy))&&!verticalAt(gx,gy)&&!hasHall(floor,gx,gy)&&!amenityAtCellF(floor,gx,gy);
}
function footprintFree(gx,gy,w,h){return footprintFreeF(1,gx,gy,w,h);}
function footprintFreeF(floor,gx,gy,w,h){
  for(var y=gy;y<gy+h;y++)for(var x=gx;x<gx+w;x++)if(!cellFreeF(floor,x,y))return false;
  return true;
}
/* A stair/elevator shaft must fit on EVERY floor at once. */
function footprintFreeAll(gx,gy,w,h){
  for(var f=1;f<=G.floors;f++)if(!footprintFreeF(f,gx,gy,w,h))return false;
  return true;
}
/* Hallways are placed as 2x2 AREAS, not single tiles. A 2x2 block
   fits when every cell is inside the grid and none is covered by a
   room, the lobby or a shaft; cells that are already hallway are
   fine (a new block may overlap a path to extend it). fresh counts
   the not-yet-hallway cells — you only pay for those. */
function hallBlockStatus(f,gx,gy){
  var fresh=0;
  for(var y=gy;y<gy+2;y++)for(var x=gx;x<gx+2;x++){
    if(!inGrid(x,y))return {valid:false,fresh:0};
    if(roomAtCellF(f,x,y)||(f===1&&isLobbyTile(x,y))||(f===1&&isDiningTile(x,y))||verticalAt(x,y)||amenityAtCellF(f,x,y))return {valid:false,fresh:0};
    if(!hasHall(f,x,y))fresh++;
  }
  return {valid:fresh>0,fresh:fresh};
}
/* Breadth-first flood from the lobby across walkable tiles (hallway
   tiles + lobby tiles). Returns the set of reachable "gx,gy" keys.
   Because the flood steps onto any hallway tile next to the lobby,
   ANY path that touches the lobby joins the network. */
function reachableSet(){
  var seen={},queue=[];
  if(G.lobby===0||G.lobbyGx==null)return seen;
  for(var y=G.lobbyGy;y<G.lobbyGy+lobbyH();y++)for(var x=G.lobbyGx;x<G.lobbyGx+lobbyW();x++){seen[x+","+y]=true;queue.push([x,y]);}
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(queue.length){
    var cur=queue.shift();
    for(var i=0;i<4;i++){
      var nx=cur[0]+dirs[i][0],ny=cur[1]+dirs[i][1],k=nx+","+ny;
      if(seen[k]||!inGrid(nx,ny))continue;
      if(hasHall(1,nx,ny)||isLobbyTile(nx,ny)||isDiningTile(nx,ny)||verticalAt(nx,ny)){seen[k]=true;queue.push([nx,ny]);}
    }
  }
  return seen;
}
/* Reachable tiles on an upper floor: flood from the stair/elevator
   shafts across that floor's own hallway tiles. */
function reachableSetFloor(floor){
  if(floor===1)return reachableSet();
  var seen={},queue=[];
  (G.verticals||[]).forEach(function(v){
    for(var y=v.gy;y<v.gy+v.h;y++)for(var x=v.gx;x<v.gx+v.w;x++){var k=x+","+y;if(!seen[k]){seen[k]=true;queue.push([x,y]);}}
  });
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(queue.length){
    var cur=queue.shift();
    for(var i=0;i<4;i++){
      var nx=cur[0]+dirs[i][0],ny=cur[1]+dirs[i][1],k=nx+","+ny;
      if(seen[k]||!inGrid(nx,ny))continue;
      if(hasHall(floor,nx,ny)||verticalAt(nx,ny)){seen[k]=true;queue.push([nx,ny]);}
    }
  }
  return seen;
}
/* A tile "touches" a reachable set when the tile itself OR any
   orthogonal neighbour is in the set. Connection is judged by
   TOUCH, not by exact tiles: a hallway path that touches the lobby
   is part of the lobby's network, a path that touches a stairwell
   or elevator links its floor to the others, and a room counts as
   reached when the network reaches the tile in front of its door
   or passes on a tile right beside that doorstep. */
function touchesSet(seen,gx,gy){
  if(seen[gx+","+gy])return true;
  var d=[[1,0],[-1,0],[0,1],[0,-1]];
  for(var i=0;i<4;i++){if(seen[(gx+d[i][0])+","+(gy+d[i][1])])return true;}
  return false;
}
/* A shaft is only usable if guests can reach its foot on Floor 1:
   with no lobby they cross the grass to it (motel-style); once a
   lobby exists, any hallway path TOUCHING the shaft (running onto
   it or right beside it) connects it — and through it, every floor
   the shaft serves. */
function verticalLive(){
  var vs=G.verticals||[];
  if(!vs.length)return false;
  if(G.lobby===0||G.lobbyGx==null)return true;
  var seen=reachableSet();
  for(var i=0;i<vs.length;i++){var v=vs[i];
    for(var y=v.gy;y<v.gy+v.h;y++)for(var x=v.gx;x<v.gx+v.w;x++)if(touchesSet(seen,x,y))return true;
  }
  return false;
}
function roomReachable(r){
  var df=doorFront(r);
  if(r.floor===1){
    if(G.lobby===0)return true; /* no lobby yet — motel-style, across the grass */
    if(isLobbyTile(df[0],df[1]))return true; /* door opens straight into the lobby */
    if(verticalAt(df[0],df[1]))return verticalLive(); /* door opens onto the stair/elevator landing */
    /* Any hallway path that touches the lobby is the lobby's network;
       the room is connected when that network reaches the doorstep
       tile or any tile right beside it. */
    var seen=reachableSet();
    return touchesSet(seen,df[0],df[1]);
  }
  /* Upper floors: ride a LIVE stairwell/elevator up, then walk THIS
     floor's hallway tiles from the shaft to the room's door. Any
     path on this floor that touches the shaft is linked through it,
     and the room counts when that network reaches its doorstep or
     a tile right beside it. No shaft, or no touching path, = nobody
     can get there. */
  if(!verticalLive())return false;
  if(verticalAt(df[0],df[1]))return true; /* door opens straight onto the shaft landing */
  var seenF=reachableSetFloor(r.floor);
  return touchesSet(seenF,df[0],df[1]);
}
function connectedCount(){
  var n=0;G.rooms.forEach(function(r){if(roomReachable(r))n++;});return n;
}
/* BFS path (list of tile centres) from the lobby to a room's door
   front, walking only hallway + lobby tiles. The walk may end on
   the doorstep tile itself or on any walkable tile right beside it
   (the touch rule), then steps onto the doorstep. Null when no
   path touches the doorstep at all. */
function gridPathToRoom(r){
  var df=doorFront(r);
  if(isLobbyTile(df[0],df[1]))return [[df[0]+0.5,df[1]+0.5]];
  function walkable(x,y){return inGrid(x,y)&&(hasHall(1,x,y)||isLobbyTile(x,y)||isDiningTile(x,y)||!!verticalAt(x,y));}
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  var targets={};
  if(walkable(df[0],df[1]))targets[df[0]+","+df[1]]=true;
  for(var ti=0;ti<4;ti++){var tx2=df[0]+dirs[ti][0],ty2=df[1]+dirs[ti][1];if(walkable(tx2,ty2))targets[tx2+","+ty2]=true;}
  if(!Object.keys(targets).length)return null;
  var prev={},queue=[],found=null;
  for(var y=G.lobbyGy;y<G.lobbyGy+lobbyH();y++)for(var x=G.lobbyGx;x<G.lobbyGx+lobbyW();x++){var k0=x+","+y;if(!prev[k0]){prev[k0]="start";queue.push([x,y]);if(targets[k0])found=k0;}}
  while(queue.length&&!found){
    var cur=queue.shift();
    for(var i=0;i<4;i++){
      var nx=cur[0]+dirs[i][0],ny=cur[1]+dirs[i][1],k=nx+","+ny;
      if(prev[k]||!inGrid(nx,ny))continue;
      if(!(hasHall(1,nx,ny)||isLobbyTile(nx,ny)||isDiningTile(nx,ny)||verticalAt(nx,ny)))continue;
      prev[k]=cur[0]+","+cur[1];queue.push([nx,ny]);
      if(targets[k]){found=k;break;}
    }
  }
  if(!found)return null;
  var path=[],k2=found;
  while(k2&&k2!=="start"){var p=k2.split(",");path.unshift([+p[0]+0.5,+p[1]+0.5]);k2=prev[k2];}
  if(found!==df[0]+","+df[1])path.push([df[0]+0.5,df[1]+0.5]); /* step from the beside-tile onto the doorstep */
  return path;
}
/* BFS path (tile centres) from the lobby to the nearest stair/elevator
   shaft tile on Floor 1 — how upstairs guests actually get up. */
function gridPathToVertical(){
  var vs=G.verticals||[];
  if(!vs.length||G.lobby===0||G.lobbyGx==null)return null;
  var targets={};
  vs.forEach(function(v){for(var y=v.gy;y<v.gy+v.h;y++)for(var x=v.gx;x<v.gx+v.w;x++)targets[x+","+y]=true;});
  var prev={},queue=[],found=null;
  for(var y0=G.lobbyGy;y0<G.lobbyGy+lobbyH();y0++)for(var x0=G.lobbyGx;x0<G.lobbyGx+lobbyW();x0++){var k0=x0+","+y0;if(!prev[k0]){prev[k0]="start";queue.push([x0,y0]);if(targets[k0])found=k0;}}
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(queue.length&&!found){
    var cur=queue.shift();
    for(var i=0;i<4;i++){
      var nx=cur[0]+dirs[i][0],ny=cur[1]+dirs[i][1],k=nx+","+ny;
      if(prev[k]||!inGrid(nx,ny))continue;
      if(!(hasHall(1,nx,ny)||isLobbyTile(nx,ny)||isDiningTile(nx,ny)||verticalAt(nx,ny)))continue;
      prev[k]=cur[0]+","+cur[1];queue.push([nx,ny]);
      if(targets[k]){found=k;break;}
    }
  }
  if(!found)return null;
  var path=[],k2=found;
  while(k2&&k2!=="start"){var p=k2.split(",");path.unshift([+p[0]+0.5,+p[1]+0.5]);k2=prev[k2];}
  return path;
}
function buildHallTile(gx,gy){
  if(hasHall(1,gx,gy)||!cellFree(gx,gy))return;
  if(!spend(HALL_COST))return;
  G.hallTiles[hallKey(1,gx,gy)]=true;
  sfx("pop");
  feed("Laid a <b>hallway tile</b> at grid "+gx+","+gy+" ($"+HALL_COST+"). Hallways are how guests get from the lobby to a room's door.");
  rebuildScene();updateHUD();
}
function paveAllHall(){
  /* Connect every unreachable room on EVERY floor: on Floor 1 the run
     starts at the lobby; upstairs it starts at the stair/elevator
     shaft (which is why a shaft has to exist and be live first). */
  if(G.lobby===0||G.lobbyGx==null){toast("Build the lobby first — hallways connect rooms to the lobby, and upstairs rooms to the stairs/elevator.");return;}
  if(G.floors>1&&!(G.verticals||[]).length){toast("Upper floors have no stairwell or elevator yet — place one on Floor 1 first; its shaft rises through every floor.");return;}
  var placed=0;
  G.rooms.filter(function(r){return !roomReachable(r);}).forEach(function(r){
    var f=r.floor, df=doorFront(r);
    if(!inGrid(df[0],df[1]))return;
    var sx,sy;
    if(f===1){sx=G.lobbyGx+(lobbyW()>2?1:0); sy=G.lobbyGy+(lobbyH()>2?1:0);}
    else{var v=(G.verticals||[])[0]; if(!v)return; sx=v.gx; sy=v.gy;}
    var x=sx,y=sy,guard=0;
    while((x!==df[0]||y!==df[1])&&guard++<80){
      if(x<df[0])x++;else if(x>df[0])x--;else if(y<df[1])y++;else if(y>df[1])y--;
      if(cellFreeF(f,x,y)){G.hallTiles[hallKey(f,x,y)]=true;placed++;}
      else if(roomAtCellF(f,x,y)||(f===1&&isLobbyTile(x,y))||(f===1&&isDiningTile(x,y))||verticalAt(x,y)){
        if(y<GRID_H-1&&cellFreeF(f,x,y+1))y++;else if(y>0&&cellFreeF(f,x,y-1))y--;else break;
      }
    }
    if(cellFreeF(f,df[0],df[1])){G.hallTiles[hallKey(f,df[0],df[1])]=true;placed++;}
  });
  if(!placed){toast("No new hallway tiles needed — or a room's door faces off the grid / into a wall. Rotate it when placing.");return;}
  feed("Laid <b>"+placed+" hallway tiles</b> connecting rooms to the lobby and the stairs/elevator.");
  toast("Hallways laid — check each room reads CONNECTED.");
  rebuildScene();updateHUD();renderPanel();
}

/* Point an existing sprite element at a direction/frame, replacing

/* Nearest iso diagonal for a movement vector. Screen version takes

   (cleaner agents): +gx travels down-right (SE), +gy down-left
   (SW), and the negatives are NW / NE. */
function dirFromScreenVec(dx,dy){

/* ---------- Camera: zoom & pan over the scene ----------
   The stage box is scaled/translated with a CSS transform, so the
   canvas, the people layer and hit-testing (which maps through the
   canvas bounding rect) all move together. Drag to pan, mouse wheel
   or pinch to zoom, + / - / Fit buttons in the corner. */
var camZ=1,camX=0,camY=0,suppressClickUntil=0,camRoot=null;
function applyCam(){
  /* The world box (camRoot) is centred on the screen with the
     -50%,-50% shift, then panned by camX/camY and scaled by camZ.
     At camZ=1 the canvas shows at its full native pixel size: the
     transform NEVER shrinks the world to fit the screen or the
     plot — only a deliberate pinch / wheel / − tap by the player
     changes the zoom, and Fit (fitCamera) restores native 100%. */
  var t="translate(-50%,-50%) translate("+camX+"px,"+camY+"px) scale("+camZ+")";
  if(camRoot)camRoot.style.transform=t;
  else if(stageBox)stageBox.style.transform=t;
}
function setCamZ(z){camZ=Math.max(0.25,Math.min(3.5,z));applyCam();}
function fitCamera(){
  /* "Fit" no longer fits: it does NOT downscale the world so the
     whole plot squeezes onto the screen. It resets the camera to
     full native size (100%) — rooms stay at their drawn pixel size
     however big the plot gets — centred on the built-up core of
     the hotel (the lobby, or the first room), because the plot is
     now so large that centring on the whole plot would leave the
     hotel itself off-screen. The player pans and zooms from there. */
  camZ=1; camX=0; camY=0;
  try{
    var fp=null;
    if(G&&G.lobby>0&&G.lobbyGx!=null)fp=iso(G.lobbyGx+lobbyW()/2,G.lobbyGy+lobbyH()/2);
    else if(G&&G.rooms.length)fp=iso(G.rooms[0].gx+roomW(G.rooms[0])/2,G.rooms[0].gy+roomH(G.rooms[0])/2);
    if(fp){camX=Math.round(CVW/2-fp[0]);camY=Math.round(CVH/2-fp[1]);}
  }catch(e){}
  applyCam();
}
function fitStage(){
  /* Size the world box (and the canvas's CSS size) to the world's
     logical size — exactly CVW x CVH CSS px, never the screen size,
     so rooms are never SIZED down to fit. The canvas backing store
     is separately RS times that (see syncCanvas), which is what
     keeps them from looking RESOLUTION-downscaled on hi-dpi
     screens. The stage box stays a full-screen window (CSS inset:0)
     and the world inside it keeps its logical size at every window
     size and every land size; overflow is panned to, not shrunk
     away. People keep their native 44px width for the same reason —
     the old formula divided it by the bitmap width, so guests
     shrank as the land grew. */
  if(!stageBox)return;
  if(camRoot){camRoot.style.width=CVW+"px";camRoot.style.height=CVH+"px";}
  if(cv){cv.style.width=CVW+"px";cv.style.height=CVH+"px";}
  PW=44;
  stageBox.style.setProperty("--pw",PW+"px");
  applyCam();
}
function rebuildScene(){renderStage();}
/* ---------- Canvas size follows the land ----------
   The canvas bitmap MUST contain the whole isometric plot. A tile is
   32x16 canvas px, so a W x H plot's diamond is (W+H)*16 wide and
   (W+H)*8 tall, plus margins for walls, labels and the street. The
   old fixed 480x300 bitmap clipped any plot bigger than the starting
   one — land beyond the edge was gone no matter how far you zoomed
   out, because zoom only scales the already-clipped bitmap. Now the
   bitmap grows with the plot (20x14 -> 32x20 and beyond) and is
   shown at that native size via fitStage + the camera: growing the
   bitmap grows the world, it never shrinks the rooms drawn on it. */
function landCanvasSize(){
  syncGridSize();
  var sum=GRID_W+GRID_H;
  return {w:sum*16+96,h:sum*8+150};
}
function syncCanvas(){
  /* The world's LOGICAL size depends only on the plot (landCanvasSize)
     and fitStage shows it at that CSS size. The canvas BACKING STORE,
     however, is RS times larger and the context transform is set to
     RS, so all drawing — which is written in logical units — is
     rasterised at RS backing pixels per logical pixel. This is the
     resolution fix: previously the backing store WAS the logical
     size, so on any screen with devicePixelRatio 2-3 (every modern
     phone, retina laptops) the browser had to upscale the bitmap
     4-9x to fill the device pixels and the rooms/grid read as
     downscaled, however the camera was set. Now the bitmap carries
     at least as many pixels as the display will show, at 100% zoom
     and well into pinch-zoom. */
  var t=landCanvasSize();
  var sizeChanged=(t.w!==CVW||t.h!==CVH);
  if(sizeChanged){CVW=t.w;CVH=t.h;ISO_AR=CVW/CVH;}
  var rs=computeRenderScale();
  if(cv&&(sizeChanged||rs!==RS)){
    RS=rs;
    cv.width=Math.round(CVW*RS); cv.height=Math.round(CVH*RS);
    /* setting width/height resets the context state — re-apply the
       supersample transform immediately (renderStage re-asserts it
       before drawing as well) */
    cxg.setTransform(RS,0,0,RS,0,0);
  }
}
function renderStage(){
  if(!sceneReady||!cv)return;

  var key=G.view+"-"+G.curFloor;

    walkers=[];lastViewKey=key;
  }

  cxg.clearRect(0,0,CVW,CVH);
  drawFloor();
  /* people are "things" too: they fade with everything else while hallways are being placed */
  if(peopleLayer)peopleLayer.style.opacity=(PLACE&&PLACE.kind==="hall")?"0.5":"";

  {

      captionEl.textContent=GRID_W+"×"+GRID_H+" · "+grooms.length+" room"+(grooms.length===1?"":"s")+(G.lobby===0?" · no lobby":" · "+conn+" connected"+(noPath?" · "+noPath+" NO PATH":""))+(dirty?" · "+dirty+" dirty":"")+(broken?" · "+broken+" broken":"")+" · drag to pan · pinch / scroll to zoom";
    }else{
      var connF=rooms.filter(function(r){return roomReachable(r);}).length;
      captionEl.textContent="Floor "+G.curFloor+" · "+rooms.length+" room"+(rooms.length===1?"":"s")+(rooms.length?" · "+connF+" connected":" · blank")+" · "+((G.verticals||[]).length?"shaft reaches here":"NO STAIRS/ELEVATOR")+(dirty?" · "+dirty+" dirty":"")+(broken?" · "+broken+" broken":"")+" · drag to pan · pinch / scroll to zoom";
    }
  }
  buildStaff();

}
function pointInPoly(x,y,poly){
  var inside=false;
  for(var i=0,j=poly.length-1;i<poly.length;j=i++){
    var xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside;

}
var lastTapGrid=null;
function handleGroundTap(){

     hallway tile (something already placed) opens its MODIFY menu;
     tapping open ground just clears the current selection. */

    var gx=Math.floor(lastTapGrid.gx), gy=Math.floor(lastTapGrid.gy);
    if(inGrid(gx,gy)&&hasHall(G.curFloor,gx,gy)&&!roomAtCellF(G.curFloor,gx,gy)&&!verticalAt(gx,gy)&&!amenityAtCellF(G.curFloor,gx,gy)&&!(G.curFloor===1&&isLobbyTile(gx,gy))&&!(G.curFloor===1&&isDiningTile(gx,gy))){

function canvasClick(e){

/* ================= Freeform placement grid =================
   Choose something to build (Build drawer, an empty plot, a grass hall

   fits and red when it doesn't. Press and HOLD on that spot for a full

var PLACE=null, holdTimer=null, holdStart=0, holdRAF=null;
function buyRoomAtGrid(type,gx,gy,rot,floor){

  var r=newRoom(type,floor,slot,gx,gy,rot); G.rooms.push(r);

  toast(t.name+" placed on Floor "+floor+" — door faces "+ROT_NAMES[rot]); rebuildScene(); updateHUD(); return true;
}
function placeVertical(kind,gx,gy){

function gridFromEvent(e){
  var rect=cv.getBoundingClientRect();
  var sx=(e.clientX-rect.left)/rect.width*CVW, sy=(e.clientY-rect.top)/rect.height*CVH;
  /* inverse of iso(), using the origin the current view actually set */
  var a=(sx-OX)/HX, b=(sy-OY)/HY;
  return {gx:(a+b)/2, gy:(b-a)/2, sx:sx, sy:sy};
}
function computeGhost(g){
  if(!PLACE)return null;
  var rot=PLACE.rot||0, pf=PLACE.floor||1;
  if(PLACE.kind==="move"){
    var mw=PLACE.w||2, mh=PLACE.h||2;
    var mgx=Math.max(0,Math.min(GRID_W-mw,Math.floor(g.gx)-Math.floor((mw-1)/2)));
    var mgy=Math.max(0,Math.min(GRID_H-mh,Math.floor(g.gy)-Math.floor((mh-1)/2)));
    var mValid=moveFootprintFree(PLACE,mgx,mgy);
    var mGhost={gx:mgx,gy:mgy,w:mw,h:mh,rot:rot,valid:mValid};
    if(PLACE.moveKind==="room"||PLACE.moveKind==="lobby"){
      mGhost.door=doorFrontAt(mgx,mgy,rot,mw,mh);
      if(!inGrid(mGhost.door[0],mGhost.door[1]))mGhost.valid=false;
    }
    return mGhost;
  }
  if(PLACE.kind==="room"){
    /* anchor the tier footprint so the tapped tile is its centre-ish */
    var pw=PLACE.w||4, ph=PLACE.h||4;
    var gx=Math.max(0,Math.min(GRID_W-pw,Math.floor(g.gx)-Math.floor((pw-1)/2)));
    var gy=Math.max(0,Math.min(GRID_H-ph,Math.floor(g.gy)-Math.floor((ph-1)/2)));
    var df=doorFrontAt(gx,gy,rot,pw,ph);
    var valid=footprintFreeF(pf,gx,gy,pw,ph)&&inGrid(df[0],df[1]);
    return {gx:gx,gy:gy,w:pw,h:ph,rot:rot,valid:valid,door:df};
  }
  if(PLACE.kind==="hall"){
    /* hallways are 2x2 areas: anchor the block at the tapped tile,
       clamped so the whole block stays on the grid */
    var tx=Math.max(0,Math.min(GRID_W-2,Math.floor(g.gx))), ty=Math.max(0,Math.min(GRID_H-2,Math.floor(g.gy)));
    var ok=hallBlockStatus(pf,tx,ty).valid;
    return {gx:tx,gy:ty,w:2,h:2,rot:rot,valid:ok};
  }
  if(PLACE.kind==="lobby"){
    var s=2;
    var lx=Math.max(0,Math.min(GRID_W-s,Math.floor(g.gx)));
    var ly=Math.max(0,Math.min(GRID_H-s,Math.floor(g.gy)));
    var valid=G.lobby===0&&footprintFree(lx,ly,s,s);
    return {gx:lx,gy:ly,w:s,h:s,rot:rot,valid:valid};
  }
  if(PLACE.kind==="dining"){
